<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Algorithm Atlas — Learn ML the fun way · Brodoit Learning</title>
<meta name="description" content="A playful, bite-sized journey through choosing the right ML algorithm — comics, quizzes and mini-games.">
<meta name="theme-color" content="#8a2e2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f4;--card:#ffffff;--ink:#2b2624;--mute:#8b837e;--soft:#f3ece7;
  --red:#a53c36;--red-soft:#fbeeec;--green:#1d9d74;--green-soft:#e7f6f0;
  --gold:#e08914;--gold-soft:#fdf3e3;--plum:#7c4dc4;--plum-soft:#f3edfc;
  --sky:#2286a8;--sky-soft:#e8f4f8;--ink-soft:#efeae6;
  --sans:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --sh:0 6px 24px rgba(43,38,36,.09);--sh-lg:0 14px 44px rgba(43,38,36,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden;min-height:100vh}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
::selection{background:var(--red);color:#fff}

/* ═══ THE GRAND DOORS ═══ */
#doorway{position:fixed;inset:0;z-index:1000;perspective:1400px;background:#161413;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity 1s ease .9s}
#doorway.gone{opacity:0;pointer-events:none}
.door-light{position:absolute;inset:0;background:radial-gradient(ellipse at center,#fff6e8 0%,#e8c98f 30%,#8a2e2a 70%,#161413 100%);opacity:0;transition:opacity 1.8s ease}
#doorway.open .door-light{opacity:1}
.door-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);height:min(80vh,720px);border:14px solid #2b2523;border-bottom:none;box-shadow:0 0 0 4px #1c1917,0 40px 120px rgba(0,0,0,.8);background:linear-gradient(180deg,#fdf3e3,#e8c98f)}
.door{position:absolute;top:0;bottom:0;width:50%;background:
  linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 12%,rgba(255,255,255,.05) 50%,rgba(0,0,0,0) 88%,rgba(0,0,0,.35)),
  repeating-linear-gradient(90deg,#5e211d 0 4px,#6d2823 4px 9px,#611f1c 9px 14px),#611f1c;
  transition:transform 2s cubic-bezier(.7,0,.25,1);box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.door::before{content:'';position:absolute;inset:7% 12%;border:3px solid rgba(246,238,236,.22);box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}
.door::after{content:'';position:absolute;inset:52% 12% 7%;border:3px solid rgba(246,238,236,.22);box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}
.door.left{left:0;transform-origin:left center;border-right:2px solid #3a1512}
.door.right{right:0;transform-origin:right center;border-left:2px solid #3a1512}
.knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7d98a,#b8860b 60%,#6b4a06);box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:2}
.door.left .knob{right:10px}.door.right .knob{left:10px}
.door-plate{position:absolute;top:34%;left:50%;transform:translateX(-50%);width:70%;text-align:center;color:#e8c98f;letter-spacing:.35em;font-weight:800;font-size:11px;text-transform:uppercase}
#doorway.open .door.left{transform:rotateY(-112deg)}
#doorway.open .door.right{transform:rotateY(112deg)}
.door-title{position:absolute;top:9vh;left:0;right:0;text-align:center;z-index:5;color:#f6eeec;padding:0 20px}
.door-title .kicker{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#e8c98f;font-weight:800}
.door-title h1{font-size:clamp(26px,6vw,44px);font-weight:900;margin-top:8px;text-transform:uppercase;letter-spacing:.04em}
.door-hint{position:absolute;bottom:8vh;left:0;right:0;text-align:center;color:#e8c98f;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;animation:pulseHint 2s infinite}
@keyframes pulseHint{0%,100%{opacity:.45}50%{opacity:1}}
#doorway.open .door-title,#doorway.open .door-hint{opacity:0;transition:opacity .6s}
.behind{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#3a1512;z-index:0;padding:20px}
.behind .big{font-size:clamp(28px,7vw,50px);font-weight:900;text-transform:uppercase;line-height:1.1}
.behind .em{font-size:54px;margin-bottom:10px;display:inline-block;animation:bob 2.4s infinite ease-in-out}

/* ═══ CHAPTER DOOR TRANSITION ═══ */
.dt{position:fixed;inset:0;z-index:900;perspective:1200px;display:flex;overflow:hidden}
.dt-half{flex:1;position:relative;box-shadow:inset 0 0 60px rgba(0,0,0,.35);transition:transform 1.1s cubic-bezier(.7,0,.25,1)}
.dt-half.left{transform-origin:left center;border-right:2px solid rgba(0,0,0,.35)}
.dt-half.right{transform-origin:right center;border-left:2px solid rgba(0,0,0,.35)}
.dt.open .dt-half.left{transform:rotateY(-105deg)}
.dt.open .dt-half.right{transform:rotateY(105deg)}
.dt-half::after{content:'';position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7d98a,#b8860b 60%,#6b4a06)}
.dt-half.left::after{right:12px}.dt-half.right::after{left:12px}
.dt-plate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:20px}
.dt-plate .de{font-size:52px}
.dt-plate .dk{font-size:10px;letter-spacing:.4em;text-transform:uppercase;font-weight:800;opacity:.8}
.dt-plate .dn{font-size:clamp(22px,5vw,34px);font-weight:900;text-transform:uppercase}
.dt.open .dt-plate{opacity:0;transition:opacity .4s}

/* ═══ DARK ATLAS WORLD (hub) ═══ */
body.world{background:radial-gradient(ellipse at 50% -10%,#2c2320 0%,#191514 55%,#120f0e 100%)}
body.world .top{background:color-mix(in srgb,#191514 82%,transparent);border-bottom-color:rgba(255,214,148,.12)}
body.world .top .back{color:#e8c98f}
body.world .top .cnt{color:#e8c98f}
body.world .top .bar-wrap{background:rgba(255,214,148,.14)}
body.world .top .bar{background:linear-gradient(90deg,#e8c98f,#ffd694)}
body.world .share-btn{background:rgba(255,214,148,.12);box-shadow:none}
body.world .hub-hero h1{color:#fff6e8;text-shadow:0 4px 30px rgba(232,201,143,.25)}
body.world .hub-hero p{color:#cbb9a4}
body.world .streakline span{background:rgba(255,214,148,.1);color:#ffd694;box-shadow:none;border:1px solid rgba(255,214,148,.18)}
body.world .searchbox{background:rgba(255,255,255,.07);box-shadow:none;border:1.5px solid rgba(255,214,148,.2)}
body.world .searchbox input{color:#fff6e8}
body.world .searchbox input::placeholder{color:#9c8b77}
body.world .lvl-head .lvl-pill{background:#e8c98f;color:#2b1d14}
body.world .lvl-head span{color:#9c8b77}
body.world .sr-none{color:#9c8b77}
/* journey trail */
.trail{position:relative;margin-top:20px;padding-left:52px}
.trail::before{content:'';position:absolute;left:24px;top:14px;bottom:14px;border-left:3px dotted rgba(255,214,148,.4)}
.tnode{position:relative;display:block;width:100%;margin-bottom:16px;background:rgba(255,255,255,.055);border:2px solid rgba(255,214,148,.18);border-radius:20px;padding:15px 16px;text-align:left;color:#fff6e8;transition:transform .18s,border-color .18s,background .18s;overflow:hidden}
.tnode:hover{transform:translateX(4px);border-color:var(--lc);background:rgba(255,255,255,.09)}
.tnode::before{content:'';position:absolute;left:-36px;top:28px;width:16px;height:16px;border-radius:50%;background:#191514;border:3px solid var(--lc);box-shadow:0 0 12px color-mix(in srgb,var(--lc) 60%,transparent)}
.tnode.done::before{background:var(--lc)}
.tnode .tk2{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--lc)}
.tnode h3{font-size:17px;font-weight:900;margin:2px 0 3px;color:#fff6e8}
.tnode p{font-size:12.5px;color:#b3a28d;font-weight:600;max-width:calc(100% - 70px)}
.tnode .lbar{height:7px;background:rgba(255,214,148,.14);border-radius:99px;margin-top:10px;overflow:hidden;max-width:calc(100% - 70px)}
.tnode .lbar i{display:block;height:100%;background:var(--lc);border-radius:99px}
.tnode .tstat{position:absolute;right:16px;bottom:14px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--lc);letter-spacing:.1em}
.rio-marker{position:absolute;left:-49px;top:-16px;font-size:24px;z-index:2;animation:bob 2s infinite ease-in-out}
/* mini door on trail node */
.tdoor-wrap{position:absolute;right:16px;top:16px;width:38px;height:56px;perspective:300px}
.tdoor-frame2{position:absolute;inset:0;border:2.5px solid rgba(255,214,148,.5);background:radial-gradient(ellipse at center,#fff2d9 0%,#e8c98f 90%);display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:3px 3px 0 0}
.tdoor{position:absolute;inset:0;background:var(--lc);border:2.5px solid rgba(0,0,0,.35);transform-origin:left center;transition:transform .5s cubic-bezier(.6,0,.3,1);border-radius:3px 3px 0 0}
.tdoor::after{content:'';position:absolute;right:5px;top:50%;width:4px;height:4px;border-radius:50%;background:#ffe9b8}
.tnode:hover .tdoor{transform:rotateY(-95deg)}
.tnode.done .tdoor{transform:rotateY(-95deg)}

/* ═══ SHELL ═══ */
.top{position:sticky;top:0;z-index:80;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(43,38,36,.07)}
.top .back{font-weight:800;font-size:14px;color:var(--red);text-decoration:none;display:flex;align-items:center;gap:5px;white-space:nowrap}
.top .bar-wrap{flex:1;height:12px;background:var(--ink-soft);border-radius:99px;overflow:hidden}
.top .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--red),#d4674f);border-radius:99px;transition:width .45s cubic-bezier(.3,.9,.3,1)}
.top .cnt{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 40px}

/* ═══ HUB ═══ */
.hub-hero{text-align:center;padding:30px 10px 8px}
.hub-hero .mascot{font-size:56px;display:inline-block;animation:bob 2.6s infinite ease-in-out}
.hub-hero h1{font-size:clamp(26px,6vw,38px);font-weight:900;text-transform:uppercase;line-height:1.1;margin:8px 0 6px}
.hub-hero p{color:var(--mute);font-size:14.5px;font-weight:600;max-width:440px;margin:0 auto}
.streakline{display:flex;justify-content:center;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.streakline span{background:var(--card);box-shadow:var(--sh);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:800}
.lessons{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.lesson-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;text-align:left;transition:transform .18s,box-shadow .18s;width:100%}
.lesson-card:active{transform:scale(.98)}
.lesson-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.lesson-card .lem{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;background:var(--lc-soft)}
.lesson-card .lbody{flex:1;min-width:0}
.lesson-card .lk{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--lc)}
.lesson-card h3{font-size:17px;font-weight:900;margin:2px 0 3px}
.lesson-card p{font-size:12.5px;color:var(--mute);font-weight:600}
.lesson-card .lbar{height:8px;background:var(--ink-soft);border-radius:99px;margin-top:9px;overflow:hidden}
.lesson-card .lbar i{display:block;height:100%;background:var(--lc);border-radius:99px;transition:width .4s}
.lesson-card .lgo{width:38px;height:38px;border-radius:50%;background:var(--lc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;flex-shrink:0;box-shadow:0 4px 12px color-mix(in srgb,var(--lc) 40%,transparent)}
.lesson-card.done .lgo{background:var(--green)}

/* ═══ LESSON STAGE ═══ */
.stage{min-height:calc(100vh - 220px);display:flex;flex-direction:column;justify-content:flex-start;padding-top:22px}
.step{animation:stepIn .45s cubic-bezier(.25,.9,.3,1.15)}
@keyframes stepIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.step.out{animation:stepOut .22s ease forwards}
@keyframes stepOut{to{opacity:0;transform:translateY(-18px) scale(.98)}}

/* comic step — inked panels, cinema (full-screen) mode */
.stage.cinema{min-height:calc(100vh - 175px);display:flex;flex-direction:column}
.cinema .step{flex:1;display:flex}
.cinema .panel{flex:1;display:flex;flex-direction:column;min-height:calc(100vh - 210px)}
.cinema .panel .art{flex:1;min-height:250px}
.cinema .panel .art svg{height:100%;width:100%;object-fit:cover}
.panel{background:var(--card);border-radius:18px;border:3px solid #241d1a;box-shadow:7px 7px 0 rgba(36,29,26,.85);overflow:hidden;transform:rotate(-.4deg);animation:slamIn .5s cubic-bezier(.2,1.1,.3,1.1) both}
@keyframes slamIn{0%{transform:scale(1.18) rotate(2.5deg);opacity:0;filter:blur(3px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1) rotate(-.4deg)}}
.burst-fly{position:fixed;font-weight:900;font-size:22px;transform:translate(-50%,0);animation:flyUp .95s ease-out forwards;z-index:999;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.2)}
@keyframes flyUp{20%{transform:translate(-50%,-14px) scale(1.35)}100%{transform:translate(-50%,-72px) scale(1);opacity:0}}
body.shake-sm{animation:shakeBody .35s}
@keyframes shakeBody{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.cbtn.ready{animation:readyPop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes readyPop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.streak-chip{position:fixed;top:64px;right:14px;z-index:120;background:linear-gradient(135deg,#ff9d2e,#f25c26);color:#fff;border-radius:99px;padding:7px 14px;font-weight:900;font-size:14px;box-shadow:0 6px 16px rgba(242,92,38,.4);animation:readyPop .4s;pointer-events:none}
.panel .art{min-height:210px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:3px solid #241d1a;background-image:radial-gradient(rgba(36,29,26,.07) 1.2px,transparent 1.2px);background-size:12px 12px}
.panel .art svg{width:100%;height:auto;display:block}
.speech{margin:14px 16px 0;background:#fff;border:2.5px solid #241d1a;border-radius:16px;padding:13px 16px;position:relative;font-size:15.5px;font-weight:700;line-height:1.45;box-shadow:3px 3px 0 rgba(36,29,26,.2)}
.speech::before{content:'';position:absolute;top:-9px;left:34px;width:15px;height:15px;background:#fff;border-left:2.5px solid #241d1a;border-top:2.5px solid #241d1a;transform:rotate(45deg)}
.speech .who{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--cc);margin-bottom:3px;text-transform:uppercase}
.panel .cap{padding:12px 16px 16px;font-size:13px;color:var(--mute);font-weight:600}
.rl-tag{position:absolute;top:12px;left:12px;background:#ffd694;border:2px solid #241d1a;border-radius:99px;padding:4px 12px;font-size:11px;font-weight:900;z-index:3;transform:rotate(-3deg)}

/* concept card step */
.ccard{background:var(--card);border-radius:24px;box-shadow:var(--sh-lg);padding:26px 22px;text-align:center}
.ccard .cem{font-size:46px;display:inline-block;animation:bob 2.6s infinite ease-in-out}
.ccard h2{font-size:22px;font-weight:900;margin:10px 0 8px;line-height:1.2}
.ccard .cbody{font-size:15px;color:#5b544f;font-weight:600;text-align:left}
.ccard .cbody p{margin-bottom:10px}
.ccard .cbody b{color:var(--ink)}
.ccard .cbody .hl{background:var(--cc-soft);border-radius:12px;padding:11px 14px;margin:10px 0;display:block}
.ccard .cbody .hl b{color:var(--cc)}
.mini-diagram{margin:12px auto 4px;max-width:420px}
.mini-diagram svg{width:100%;height:auto}

/* tap-reveal grid */
.tap-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tap-grid.cols3{grid-template-columns:repeat(3,1fr)}
.flip{perspective:700px;min-height:150px}
.flip .fin{position:relative;width:100%;height:100%;min-height:150px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.3,1.2)}
.flip.on .fin{transform:rotateY(180deg)}
.flip .ff,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
.flip .ff{background:var(--fc);color:#fff;font-weight:900;box-shadow:var(--sh)}
.flip .ff .fem{font-size:34px;margin-bottom:6px}
.flip .ff .ft{font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.flip .ff .tap-hint{font-size:10px;opacity:.75;font-weight:700;margin-top:7px;letter-spacing:.12em}
.flip .fb{background:var(--card);box-shadow:var(--sh);transform:rotateY(180deg);font-size:12px;font-weight:600;color:#5b544f;line-height:1.4}
.flip .fb b{color:var(--fc);display:block;margin-bottom:3px;font-size:12.5px}

/* quiz */
.quiz .qq{background:var(--card);border-radius:24px;box-shadow:var(--sh-lg);padding:22px;text-align:center;margin-bottom:16px}
.quiz .qtag{display:inline-block;background:var(--cc-soft);color:var(--cc);border-radius:99px;padding:5px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:10px}
.quiz .qq h2{font-size:19px;font-weight:900;line-height:1.3}
.quiz .qq .qem{font-size:40px;margin-bottom:6px;display:inline-block}
.qopts{display:flex;flex-direction:column;gap:11px}
.qopt{background:var(--card);border:2.5px solid var(--ink-soft);border-radius:18px;padding:15px 16px;font-size:15px;font-weight:800;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .15s,border-color .15s,background .15s}
.qopt .oem{font-size:22px}
.qopt:hover{border-color:var(--cc);transform:translateY(-2px)}
.qopt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);animation:popIn .4s cubic-bezier(.3,1.4,.5,1)}
.qopt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);animation:shake .4s}
.qopt:disabled{opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes popIn{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.qwhy{margin-top:14px;background:var(--green-soft);border-radius:16px;padding:13px 16px;font-size:13.5px;font-weight:700;color:#14684d;display:none;animation:stepIn .35s}
.qwhy.show{display:block}
.qwhy.oops{background:var(--red-soft);color:var(--red)}

/* interactive widgets */
.widget{background:var(--card);border-radius:24px;box-shadow:var(--sh-lg);padding:22px;text-align:center}
.widget h2{font-size:19px;font-weight:900;margin-bottom:4px}
.widget .wsub{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:14px}
.widget input[type=range]{width:100%;accent-color:var(--red);height:34px}
.bigread{font-size:38px;font-weight:900;font-family:var(--mono)}
.wbtn{background:var(--cc);color:#fff;border-radius:99px;padding:13px 26px;font-size:15px;font-weight:900;box-shadow:0 6px 18px color-mix(in srgb,var(--cc) 35%,transparent);transition:transform .15s}
.wbtn:active{transform:scale(.95)}
.wbtn:disabled{opacity:.5}
.wnote{margin-top:13px;background:var(--cc-soft);border-radius:14px;padding:11px 14px;font-size:13px;font-weight:700;color:var(--cc);text-align:left}
/* RL grid game */
.rlgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:320px;margin:8px auto}
.rlcell{aspect-ratio:1;background:var(--soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;transition:background .2s}
.rlcell.robot{background:var(--plum-soft)}
.dpad{display:grid;grid-template-columns:repeat(3,54px);gap:7px;justify-content:center;margin-top:14px}

    else if(kind==='nope'){o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(140,t+.16);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.25)}

    else if(kind==='door'){o.type='sine';o.frequency.setValueAtTime(85,t);o.frequency.exponentialRampToValueAtTime(42,t+1.6);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+1.7);o.start(t);o.stop(t+1.8)}

}

  {t:'flip',cc:'ink',title:'Tap each door to peek inside 👇',sub:'All 4 to continue',cards:[

/* ─────────── 2 · SUPERVISED ─────────── */
{id:'supervised',emoji:'🎯',color:'red',title:'Supervised',tag:'LESSON 2',
 desc:'Spam filters, price predictions & the answer key',
 steps:[
  {t:'comic',who:'RIO',cc:'red',bubble:'First real job! The bank has 10,000 old loan files — each stamped REPAID ✅ or DEFAULTED ❌. Predict the new customers!',
   art:scene('linear-gradient(160deg,#fbeeec,#f6ddd8)',
     '<g font-size="34">'+emAt('📁',60,70,38)+emAt('📁',150,55,38)+emAt('📁',240,75,38)+'</g>'
     +'<g font-size="22">'+emAt('✅',82,90,22)+emAt('❌',172,75,22)+emAt('✅',262,95,22)+'</g>'
     +svgWrap(rio('smile'),130,105,.95)
     +'<text x="240" y="170" font-size="12" font-family="monospace" font-weight="bold" fill="#8b837e">history = X, stamp = Y</text>'),
   cap:'Real life: banks, insurance, hospitals — anywhere the past has answers.'},
  {t:'card',cc:'red',em:'🏫',title:'School with an answer key',
   body:'<p>Supervised learning = practice questions <b>with solutions</b>.</p><span class="hl">The model guesses → checks the real answer → <b>adjusts itself</b> → repeats a million times.</span><p>Your phone\'s spam filter, face unlock, and loan approvals all learned this way.</p>'},
  {t:'card',cc:'red',em:'🔀',title:'Two flavours only',
   body:'<span class="hl"><b>🏷️ Classification → a category.</b> Spam or not? Cat or dog? Will they repay: yes/no?</span>'
   +'<span class="hl"><b>📏 Regression → a number.</b> House price? Delivery minutes? Tomorrow\'s temperature?</span>'
   +'<p>Ask: <b>is my answer a label or a number?</b> That one question picks your toolbox.</p>'},
  {t:'quiz',cc:'red',em:'🌡️',q:'"Predict tomorrow\'s temperature in Mumbai."',tag:'Label or number?',opts:[
    {em:'📏',txt:'Regression — it\'s a number',ok:true,why:'32.4°C is a continuous number → regression.'},
    {em:'🏷️',txt:'Classification — it\'s a category',why:'A temperature isn\'t a category — it\'s a number on a scale. Regression!'}]},
  {t:'quiz',cc:'red',em:'📸',q:'"Is this photo a cat or a dog?"',tag:'Label or number?',opts:[
    {em:'🏷️',txt:'Classification',ok:true,why:'Two buckets — cat / dog. Choosing a bucket = classification.'},
    {em:'📏',txt:'Regression',why:'There\'s no number to predict here — just two categories. Classification!'}]},
  {t:'sigmoid',cc:'red'},
  {t:'card',cc:'red',em:'⚖️',title:'That was Logistic Regression!',
   body:'<p>What you just played with is the real algorithm banks use:</p><span class="hl">Weigh each clue (income ×2, missed payments ×−5…) → add up → squeeze through an <b>S-curve</b> → out comes a probability 0-100%.</span><p>Fast, explainable, and the <b>first thing to try</b> for any yes/no question.</p>'},
  {t:'card',cc:'red',em:'🌳',title:'When patterns get twisty',
   body:'<span class="hl"><b>🌲 Random Forest</b> — asks 500 slightly-different decision trees to <b>vote</b>. The crowd beats any single tree.</span>'
   +'<span class="hl"><b>🚀 XGBoost</b> — trees in a relay: each new tree <b>fixes the last one\'s mistakes</b>. The king of Kaggle competitions.</span>'
   +'<p>Messy tabular data? Forests first, XGBoost for the last drop of accuracy.</p>'},
  {t:'quiz',cc:'red',em:'📉',q:'Jio wants "the % chance this customer leaves next month" — and managers must understand why.',tag:'First algorithm to try?',opts:[
    {em:'⚖️',txt:'Logistic Regression',ok:true,why:'Needs a probability + explainability → Logistic Regression is the perfect starting point.'},
    {em:'🧠',txt:'Giant neural network',why:'Overkill, and hard to explain to managers. Start simple — earn complexity!'},
    {em:'🔍',txt:'K-Means clustering',why:'K-Means finds groups without answers — but here we HAVE past churn labels. Supervised!'}]},
  {t:'recap',cc:'red',em:'🎯',title:'Supervised — done!',pts:['🏷️ Category → Classification · 📏 Number → Regression','⚖️ Start simple: Logistic / Linear Regression','🌲 Messy patterns → Random Forest → 🚀 XGBoost','The past must contain the answers!']}
 ]},

{id:'unsupervised',emoji:'🔍',color:'green',title:'Unsupervised',tag:'LESSON 3',
 desc:'Netflix tribes, fraud catching & hidden patterns',
 steps:[
  {t:'comic',who:'RIO',cc:'green',bubble:'New gig: a night market\'s loyalty app. 50,000 customers… and ZERO labels. No answer key at all! 😰',
   art:scene('linear-gradient(160deg,#e7f6f0,#d5ece2)',

  {t:'kmeans',cc:'green'},
  {t:'card',cc:'green',em:'⛺',title:'That was K-Means!',
   body:'<p>The tent-pole game you just ran is the real algorithm:</p><span class="hl">1️⃣ Drop K poles randomly → 2️⃣ every point joins its nearest pole → 3️⃣ each pole moves to the middle of its crowd → repeat till nobody switches.</span><p>Fast, simple — the <b>first clustering tool</b> everyone reaches for.</p>'},
  {t:'card',cc:'green',em:'🏘️',title:'Weird shapes? DBSCAN.',
   body:'<p>K-Means loves round blobs. But real groups can be moon-shaped, spiral, anything.</p><span class="hl"><b>DBSCAN</b> walks point-to-point: enough neighbours nearby = same village — whatever its shape. Loners in the wilderness get flagged as <b>noise</b>.</span><p>Bonus: you don\'t even have to choose K!</p>'},
  {t:'quiz',cc:'green',em:'💳',q:'One Paytm account suddenly buys 40 gift cards at 3 AM. Every other user looks nothing like this.',tag:'What job is this?',opts:[
    {em:'🚨',txt:'Anomaly detection',ok:true,why:'A point that fits NO group = an outlier. Isolation Forest is built exactly for this — fraud teams love it.'},
    {em:'⛺',txt:'Clustering',why:'Clustering groups the normal folks — but this account belongs to no group. It\'s an anomaly!'},
    {em:'📏',txt:'Regression',why:'Nothing to predict here — we\'re hunting the weird one. Anomaly detection!'}]},
  {t:'card',cc:'green',em:'🃏',title:'Isolation Forest — the fraud hunter',
   body:'<p>How do you find the weirdo among 50,000 users?</p><span class="hl">Slice the data with <b>random cuts</b>, like Guess Who. Normal points take many cuts to corner. The 3 AM gift-card buyer? <b>Isolated in 2 cuts.</b> Few cuts = suspicious.</span><p>Used in real fraud, defect & intrusion detection every day.</p>'},
  {t:'quiz',cc:'green',em:'🏋️',q:'A gym wants to group members by workout habits to design 3 new membership plans. No existing labels.',tag:'Your toolbox?',opts:[
    {em:'⛺',txt:'K-Means clustering',ok:true,why:'Unlabelled + "find me groups" + you know roughly how many (3 plans) → K-Means. Textbook!'},
    {em:'🎯',txt:'Logistic Regression',why:'That needs an answer key — but nothing is labelled here. Clustering!'},
    {em:'🚨',txt:'Isolation Forest',why:'That hunts outliers. Here we want the main groups — clustering.'}]},
  {t:'card',cc:'green',em:'🗜️',title:'One more superpower: squashing',
   body:'<p>100 columns about each customer? Most repeat each other.</p><span class="hl"><b>PCA</b> finds the few "master directions" (like <i>overall spend</i> & <i>visit rhythm</i>) that carry 95% of the story — and archives the noise.</span><p>Fewer columns → faster models, and you can finally <b>plot</b> your data.</p>'},
  {t:'recap',cc:'green',em:'🔍',title:'Unsupervised — done!',pts:['⛺ Find groups → K-Means · weird shapes → DBSCAN','🚨 Find the weirdo → Isolation Forest','🗜️ Too many columns → PCA','No labels needed — the data confesses its own structure']}
 ]},

    {fc:'#a3660a',em:'🏖️',ft:'Deep layers',fb:'<b>See whole things.</b>Shapes combine into "palm tree", "umbrella", "beach"! Features built from features.'}],cols:3},
  {t:'nnet',cc:'gold'},
  {t:'card',cc:'gold',em:'🏗️',title:'Your data type picks the machine',
   body:'<span class="hl">🖼️ <b>Images → CNN</b> (ResNet, EfficientNet) — sliding pattern-finders. FaceID, X-ray reading, crop disease apps.</span>'
   +'<span class="hl">📝 <b>Text → Transformer</b> (BERT, GPT, Claude) — every word attends to every other word. ChatGPT is this, scaled up!</span>'
   +'<span class="hl">🔊 <b>Voice → sequence models</b> (RNN/Transformer) — Alexa, "Hey Google", YouTube auto-captions.</span>'
   +'<span class="hl">🎬 <b>Video → 3D CNN</b> — sees motion, not just frames. Action detection in CCTV.</span>'},
  {t:'quiz',cc:'gold',em:'💬',q:'Your startup wants a support chatbot that actually understands customers and writes helpful replies.',tag:'Which machine?',opts:[
    {em:'📝',txt:'Transformer / LLM',ok:true,why:'Language in, language out → Transformer (an LLM like GPT/Claude). In 2026 you usually fine-tune or prompt one, not train from scratch!'},
    {em:'🖼️',txt:'CNN',why:'CNNs are for images. Language needs attention — Transformers!'},
    {em:'⛺',txt:'K-Means',why:'That finds groups in data — it can\'t hold a conversation. LLM time!'}]},
  {t:'quiz',cc:'gold',em:'⛑️',q:'A construction firm wants CCTV to flag workers without helmets — live, drawing boxes around them.',tag:'Which machine?',opts:[
    {em:'📦',txt:'YOLO (a detection CNN)',ok:true,why:'Finding + boxing objects in real time = object detection. YOLO does it in one lightning pass.'},
    {em:'📝',txt:'BERT',why:'BERT reads text. Helmets live in pixels — CNN territory!'},
    {em:'📏',txt:'Linear Regression',why:'A straight line can\'t find helmets in video frames. Deep vision needed.'}]},
  {t:'card',cc:'gold',em:'🪄',title:'The attention trick (why ChatGPT works)',
   body:'<p>In <i>"the bank of the river"</i> — how does the model know it\'s not a money bank?</p><span class="hl">Because <b>"bank" pays attention to "river"</b>. In a Transformer, every word asks every other word: "how much do you change MY meaning?" — all at once, in parallel.</span><p>Stack that trick 100 layers deep, train on the internet → ChatGPT, Gemini, Claude.</p>'},
  {t:'card',cc:'gold',em:'⚠️',title:'When NOT to go deep',
   body:'<p>Deep learning is hungry: it wants <b>lots of data + GPUs</b>.</p><span class="hl">Normal spreadsheet data? <b>XGBoost usually beats neural nets</b> — race them before going deep.</span><p>Rule: unstructured data (pixels, words, sound) → deep. Structured tables → trees first.</p>'},
  {t:'recap',cc:'gold',em:'🧠',title:'Deep Learning — done!',pts:['Layers see edges → shapes → things','🖼️ CNN · 📝 Transformer/LLM · 🔊 sequence models · 🎬 3D CNN','🪄 Attention: every word looks at every word','📊 Plain tables? Try XGBoost first!']}
 ]},

/* ─────────── 5 · REINFORCEMENT ─────────── */
{id:'rl',emoji:'🤖',color:'plum',title:'Reinforcement',tag:'LESSON 5',
 desc:'Play the robot game & learn by rewards',
 steps:[
  {t:'comic',who:'BYTE',cc:'plum',bubble:'Last realm! No dataset here AT ALL. This little robot must learn to reach the package… by trying, failing and scoring points. 🦾',
   art:scene('linear-gradient(160deg,#f3edfc,#e6dcf5)',
     '<g stroke="#d8cdeb" stroke-width="2">'
     +'<line x1="30" y1="60" x2="310" y2="60"/><line x1="30" y1="110" x2="310" y2="110"/><line x1="30" y1="160" x2="310" y2="160"/>'
     +'<line x1="100" y1="25" x2="100" y2="195"/><line x1="170" y1="25" x2="170" y2="195"/><line x1="240" y1="25" x2="240" y2="195"/></g>'
     +'<g font-size="30">'+emAt('🤖',65,50,28)+emAt('📦',275,145,30)+emAt('🕳️',135,95,26)+emAt('🕳️',205,145,26)+'</g>'),
   cap:'Real life: game bots, robot arms, self-driving cars, even ChatGPT\'s final training.'},
  {t:'card',cc:'plum',em:'🔁',title:'The loop that runs everything',
   body:'<span class="hl"><b>See</b> where you are (state) → <b>choose</b> a move (action) → world <b>scores</b> you (reward) → world changes → repeat.</span><p>The agent\'s only goal: collect the most <b>total</b> reward over the whole future — not just the next treat.</p><p>Sounds like life? That\'s why it cracks games, robots and traffic lights.</p>'},
  {t:'rlgame',cc:'plum'},
  {t:'card',cc:'plum',em:'🎉',title:'You just did RL — by hand!',
   body:'<p>You explored, hit penalties, found the reward. Now imagine the robot doing that <b>10,000 times per second</b>, remembering the score of every move in every square.</p><span class="hl">That memory table is literally called a <b>Q-table</b> — and learning it is <b>Q-Learning</b>.</span><p>When the world is too big for a table (like an Atari screen), a neural net estimates the scores instead → <b>DQN</b>.</p>'},
  {t:'card',cc:'plum',em:'🍽️',title:'Explore vs Exploit — the eternal dilemma',
   body:'<p>Friday dinner: your favourite biryani place (guaranteed 😋) or the new café (might be amazing… might be terrible)?</p><span class="hl">Always exploit → you never find better. Always explore → you eat a lot of bad meals. RL agents balance both (mostly-best + occasional random try).</span>'},
  {t:'quiz',cc:'plum',em:'🧐',q:'Which of these is actually a Reinforcement Learning problem?',tag:'Spot the RL',opts:[
    {em:'♟️',txt:'A bot mastering chess by self-play',ok:true,why:'Sequential moves, wins as rewards, millions of games — exactly how AlphaZero learned!'},
    {em:'📧',txt:'Sorting emails into spam / not spam',why:'That\'s supervised — it learns from already-labelled emails.'},
    {em:'🛍️',txt:'Grouping shoppers by behaviour',why:'Finding unlabelled groups = unsupervised clustering.'}]},
  {t:'card',cc:'plum',em:'🎛️',title:'Menus vs dials',
   body:'<span class="hl"><b>🕹️ Menu of moves</b> (up/down, buy/hold, chess moves) → <b>DQN family</b>.</span>'
   +'<span class="hl"><b>🎚️ Smooth dials</b> (steering 23.7°, joint torque) → <b>PPO / SAC</b>. A robot elbow can\'t pick from a menu!</span>'
   +'<p>Fun fact: <b>PPO</b> also fine-tuned ChatGPT to be helpful — that\'s RLHF.</p>'},
  {t:'quiz',cc:'plum',em:'🦾',q:'A warehouse robot arm must learn exactly how much force to grip each parcel with — too little drops it, too much crushes it.',tag:'Which tool?',opts:[
    {em:'🎚️',txt:'PPO / SAC — continuous control',ok:true,why:'Grip force is a smooth dial, not a menu → continuous action space → PPO/SAC.'},
    {em:'🕹️',txt:'Q-Learning table',why:'A table needs a small menu of actions. Force is continuous — dials, not menus!'},
    {em:'⛺',txt:'K-Means',why:'No groups to find here — an agent is learning from rewards. RL!'}]},
  {t:'recap',cc:'plum',em:'🤖',title:'Reinforcement — done!',pts:['🔁 State → action → reward → repeat','🕹️ Menu of moves → Q-Learning / DQN','🎚️ Smooth dials → PPO / SAC','🍽️ Balance exploring & exploiting']}
 ]},

/* ═══════ LEVEL 2 · TOOL VAULTS — every algorithm, one card at a time ═══════ */
{id:'vault_sup',emoji:'🗄️',color:'red',title:'Supervised Vault',tag:'VAULT · 10 TOOLS',level:2,
 desc:'Every supervised tool — when to grab which',
 steps:[
  {t:'card',cc:'red',em:'🗄️',title:'Welcome to the Vault',
   body:'<p>Level 2 = the <b>armoury</b>. One tool per card: what it is, when to grab it, and where it runs in real life.</p><span class="hl">🌟 <b>Golden rule:</b> start simple → traditional ML first → deep learning only when necessary.</span>'},
  {t:'tool',cc:'red',em:'⚖️',name:'Logistic Regression',sub:'The explainable classifier',chips:['Classification','Structured data','Interpretable'],
   best:'Binary yes/no questions where you must <b>explain the decision</b> — approvals, risk, medical screening.',
   how:'Weighs each feature, sums them, squeezes the total through an S-curve into a 0-100% probability. You can literally read the weights to see <b>why</b>.',
   real:'🏦 Banks explaining "why was my loan rejected?" — regulators demand this level of transparency.'},
  {t:'tool',cc:'red',em:'🛣️',name:'SVM (SVC)',sub:'The widest-street builder',chips:['Classification','High-dimensional','Clear margin'],
   best:'High-dimensional data where classes separate cleanly and you want the <b>most confident boundary</b>.',
   how:'Finds the boundary with the <b>maximum gap</b> to the nearest points of each class. The kernel trick bends space so curvy boundaries become straight ones.',
   real:'🧬 Classifying gene-expression data — thousands of columns, few rows: SVM territory.'},
  {t:'tool',cc:'red',em:'🌴',name:'Decision Tree',sub:'The 20-questions player',chips:['Both tasks','Interpretable','Building block'],
   best:'When you want a model you can <b>draw on a whiteboard</b> — a flowchart of if/else questions.',
   how:'Repeatedly picks the question that best splits the data ("income > 50k?"), building a tree of decisions. Powerful but prone to memorising — which is why we grow forests of them.',
   real:'🩺 Triage flowcharts in clinics — and the building block inside Random Forest & XGBoost.'},
  {t:'tool',cc:'red',em:'🌲',name:'Random Forest',sub:'The wisdom of crowds',chips:['Both tasks','Mixed data','Robust'],
   best:'Non-linear, messy tabular data. Nearly tuning-free — the <b>reliable workhorse</b>.',
   how:'Trains hundreds of decision trees, each on a random slice of rows AND columns, then lets them <b>vote</b>. Their individual mistakes cancel out.',
   real:'🏥 Hospital readmission risk from mixed patient records — ages, categories, missing values and all.'},
  {t:'tool',cc:'red',em:'🚀',name:'XGBoost / LightGBM',sub:'The competition winner',chips:['Both tasks','Structured data','Max accuracy'],
   best:'When you need the <b>highest accuracy on tabular data</b> and will tune for it.',
   how:'Trees built in a relay — each new tree trains on the <b>errors of the ensemble so far</b>. LightGBM is its lightning-fast sibling for huge datasets.',
   real:'🏆 Won more Kaggle competitions than any other algorithm. Flipkart-scale demand forecasting runs on this.'},
  {t:'tool',cc:'red',em:'📬',name:'Naive Bayes',sub:'The speed-reading probabilist',chips:['Classification','Text','Probabilistic'],
   best:'Text classification with limited data — <b>fast, simple, surprisingly strong</b>.',
   how:'Uses Bayes\' theorem assuming every word is independent (naive — but it works!). Counts word frequencies per class, multiplies probabilities.',
   real:'📧 The original Gmail spam filter. Still the 10-minute baseline for any text task.'},
  {t:'quiz',cc:'red',em:'✉️',q:'You have 2,000 customer emails to sort into complaint / query / praise — and one afternoon.',tag:'Quick pick!',opts:[
    {em:'📬',txt:'Naive Bayes',ok:true,why:'Small text dataset + speed = Naive Bayes. Baseline in minutes, then upgrade if needed.'},
    {em:'🚀',txt:'Train an LLM from scratch',why:'That\'s months and millions. Start simple — Naive Bayes this afternoon!'},
    {em:'🌲',txt:'Random Forest on raw text',why:'Forests want structured features; for quick raw-text work Naive Bayes wins the afternoon.'}]},
  {t:'tool',cc:'red',em:'🏘️',name:'KNN',sub:'The neighbourhood gossip',chips:['Both tasks','Small datasets','Zero training'],
   best:'Small datasets, quick baselines. <b>No training at all</b> — it just remembers everything.',
   how:'To classify a new point, look at its <b>K nearest neighbours</b> and copy the majority. That\'s the whole algorithm.',
   real:'🎬 "Users like you also watched…" — the simplest recommender is literally KNN.'},
  {t:'tool',cc:'red',em:'📏',name:'Linear Regression',sub:'The straight-line classic',chips:['Regression','Linear patterns','Interpretable'],
   best:'When the relationship is roughly a straight line and you want <b>instant interpretability</b>.',
   how:'Finds the line minimising total squared error. Each coefficient reads as "+1 bedroom ⇒ +₹12 lakh".',
   real:'🏠 Housing price estimates, salary vs experience, ad spend vs sales — the first model in every textbook for a reason.'},
  {t:'tool',cc:'red',em:'🪢',name:'Ridge / Lasso',sub:'The disciplined lines',chips:['Regression','Prevents overfitting','Feature selection'],
   best:'Linear models with <b>many correlated features</b> — or when you want useless features auto-deleted.',
   how:'Adds a penalty for big weights. Ridge shrinks them smoothly; <b>Lasso shrinks weak ones to exactly zero</b> — free feature selection.',
   real:'📊 Marketing-mix models with 60 overlapping channels — Lasso tells you which 8 actually matter.'},
  {t:'tool',cc:'red',em:'🎛️',name:'SVR (RBF)',sub:'The curvy-line fitter',chips:['Regression','Non-linear','Medium data'],
   best:'Non-linear regression on small-to-medium data where tree ensembles disappoint.',
   how:'SVM\'s regression cousin: fits a <b>tube</b> around the data, ignores errors inside the tube, and uses the RBF kernel to bend with the curve.',
   real:'⚡ Electricity-load forecasting — smooth non-linear daily curves fit beautifully in the tube.'},
  {t:'tool',cc:'red',em:'🕸️',name:'Neural Network (MLP)',sub:'The universal approximator',chips:['Both tasks','Complex non-linear','Data hungry'],
   best:'Complex non-linear relationships when you have <b>plenty of data</b> — and trees have hit their ceiling.',
   how:'Layers of tiny weighted judges; backpropagation walks each error backwards, nudging every weight. Given enough neurons, it can fit <b>any</b> continuous pattern.',
   real:'💹 Price optimisation engines at scale — and the gateway drug to deep learning.'},
  {t:'quiz',cc:'red',em:'🤝',q:'Your model has 60 marketing features, half of them overlapping. You want the useless ones GONE automatically.',tag:'Vault check',opts:[
    {em:'🪢',txt:'Lasso',ok:true,why:'The L1 penalty shrinks weak weights to exactly zero — automatic feature deletion!'},
    {em:'🏘️',txt:'KNN',why:'KNN deletes nothing — it just measures distances. Lasso is the feature-pruner.'},
    {em:'🕸️',txt:'MLP',why:'Neural nets keep everything. Lasso is the one that zeroes features out.'}]},
  {t:'recap',cc:'red',em:'🗄️',title:'Supervised Vault — cleared!',pts:['⚖️ Explain a yes/no → Logistic · 🛣️ clean margins → SVM','🌲 Messy tables → Forest · 🚀 max accuracy → XGBoost','📬 Quick text → Naive Bayes · 🏘️ tiny data → KNN','📏 Lines → Linear · 🪢 too many features → Lasso','🎛️ Smooth curves → SVR · 🕸️ huge & twisty → MLP']}
 ]},

{id:'vault_unsup',emoji:'🧰',color:'green',title:'Unsupervised Vault',tag:'VAULT · 10 TOOLS',level:2,
 desc:'Clustering, squashing & anomaly kits in detail',
 steps:[
  {t:'tool',cc:'green',em:'⛺',name:'K-Means',sub:'The tent-pole clusterer',chips:['Clustering','Numerical','K known'],
   best:'Round-ish clusters when you roughly <b>know how many groups</b> to expect. Fast at any scale.',
   how:'Drop K poles → points join nearest pole → poles move to their crowd\'s centre → repeat. (You played this in Lesson 3!)',
   real:'🛍️ Myntra segmenting shoppers into budget / brand / trend tribes for campaigns.'},
  {t:'tool',cc:'green',em:'🏘️',name:'DBSCAN',sub:'The shape-agnostic villager',chips:['Clustering','Arbitrary shapes','Handles noise'],
   best:'Unknown cluster count, <b>weird shapes</b> (moons, spirals), noisy data with outliers.',
   how:'Dense neighbourhoods chain into villages, whatever their shape. Points with too few neighbours get labelled <b>noise</b> — free anomaly flagging.',
   real:'🗺️ Finding crime or accident hotspots on a city map — hotspots are never round.'},
  {t:'tool',cc:'green',em:'🌳',name:'Hierarchical Clustering',sub:'The family-tree builder',chips:['Clustering','No K needed','Dendrogram'],
   best:'When you want to <b>explore groupings at every zoom level</b> instead of fixing K.',
   how:'Repeatedly merges the two closest clusters until one remains, recording every merge in a <b>dendrogram</b> — cut the tree wherever suits you.',
   real:'🧬 Grouping genes by expression, or building taxonomy trees of customer behaviour.'},
  {t:'tool',cc:'green',em:'🫧',name:'GMM',sub:'The soft-membership mixer',chips:['Clustering','Overlapping','Probabilistic'],
   best:'When clusters <b>overlap</b> and points can partially belong to several.',
   how:'Models data as overlapping Gaussian blobs; the EM algorithm alternates "who owns this point?" with reshaping the blobs. Output: "70% night-owl, 30% family-shopper".',
   real:'🎵 Spotify-style taste modelling — you\'re rarely 100% one genre.'},
  {t:'quiz',cc:'green',em:'🌙',q:'Your clusters look like two interlocking crescents, plus scattered junk points.',tag:'Vault check',opts:[
    {em:'🏘️',txt:'DBSCAN',ok:true,why:'Arbitrary shapes + noise flagging = DBSCAN\'s home turf. K-Means would slice the moons in half!'},
    {em:'⛺',txt:'K-Means',why:'K-Means draws round tents — it butchers crescents. DBSCAN follows the shape.'},
    {em:'🫧',txt:'GMM',why:'Gaussian blobs are still roundish-ellipses. Crescents need density-chaining: DBSCAN.'}]},
  {t:'tool',cc:'green',em:'🗜️',name:'PCA',sub:'The master-direction finder',chips:['Dim. reduction','Removes collinearity','Linear'],
   best:'Too many numerical columns, or correlated features slowing everything down.',
   how:'Rotates the data to face the <b>directions of maximum variance</b>, keeps the top few, archives the rest. Linear, fast, deterministic.',
   real:'📷 Compressing 4,000-pixel face images into 150 "eigenface" numbers that still identify people.'},
  {t:'tool',cc:'green',em:'🎨',name:'t-SNE',sub:'The beautiful-map painter',chips:['Visualization','2D/3D','Local structure'],
   best:'Making <b>2-D pictures</b> of high-dimensional data where neighbourhoods stay together.',
   how:'Pulls similar points together and pushes different ones apart until the 2-D map "feels like" the original space. For looking, not for modelling!',
   real:'🔬 Those gorgeous cluster maps of word embeddings or cell types in research papers? t-SNE.'},
  {t:'tool',cc:'green',em:'🌐',name:'UMAP',sub:'The faster map-maker',chips:['Visualization','Structure preserving','Scales better'],
   best:'Like t-SNE but <b>faster</b> and better at keeping the global picture honest.',
   how:'Builds a graph of neighbourhoods and lays it out in 2-D preserving both local and (more of the) global structure.',
   real:'🧪 The default "show me my embedding space" tool in modern ML teams.'},
  {t:'tool',cc:'green',em:'🛒',name:'Association Rules (Apriori)',sub:'The basket whisperer',chips:['Association','Market basket','Rules'],
   best:'Finding <b>"people who buy X also buy Y"</b> patterns in transactions.',
   how:'Counts which item-combos appear together more often than chance, mining rules like bread+butter → jam (confidence 78%).',
   real:'🛍️ D-Mart shelf placement and Amazon\'s "frequently bought together".'},
  {t:'tool',cc:'green',em:'🃏',name:'Isolation Forest',sub:'The outlier hunter',chips:['Anomaly detection','High-dimensional','Scalable'],
   best:'Fraud, defects, intrusions in <b>tabular data</b> — especially with many columns.',
   how:'Random cuts isolate points; weirdos get cornered in very <b>few cuts</b>. Few cuts = high anomaly score.',
   real:'💳 UPI fraud engines flagging the 3 AM gift-card spree among crores of normal transactions.'},
  {t:'tool',cc:'green',em:'⭕',name:'One-Class SVM',sub:'The normalcy fence',chips:['Anomaly detection','One class only','Boundary based'],
   best:'When you only have examples of <b>normal</b> behaviour and must fence it off.',
   how:'Learns the tightest boundary around normal data; anything falling outside the fence is anomalous.',
   real:'🏭 Machine-health monitoring: you have years of "healthy" sensor data and zero examples of tomorrow\'s failure.'},
  {t:'tool',cc:'green',em:'🪞',name:'Autoencoder',sub:'The compression mirror',chips:['Anomaly detection','Representation learning','Neural'],
   best:'Non-linear compression, and anomaly detection on <b>complex data</b> (images, signals).',
   how:'A neural net forced to squeeze data through a tiny bottleneck and rebuild it. It rebuilds normal data well — <b>weird data reconstructs badly</b>, exposing itself.',
   real:'🩻 Spotting defective products on assembly-line cameras trained only on good ones.'},
  {t:'quiz',cc:'green',em:'🏭',q:'A factory has 5 years of healthy-machine sensor data and no failure examples. Catch problems early.',tag:'Vault check',opts:[
    {em:'⭕',txt:'One-Class SVM (or Autoencoder)',ok:true,why:'Only-normal-data problems → learn the fence around normal. Both tools are built for exactly this.'},
    {em:'⚖️',txt:'Logistic Regression',why:'Supervised needs BOTH classes — there are no failure examples. Fence off normal instead!'},
    {em:'🎨',txt:'t-SNE',why:'t-SNE draws pretty maps — it doesn\'t raise alarms. One-Class SVM guards the fence.'}]},
  {t:'recap',cc:'green',em:'🧰',title:'Unsupervised Vault — cleared!',pts:['⛺ K known → K-Means · 🏘️ weird shapes → DBSCAN','🌳 explore levels → Hierarchical · 🫧 overlaps → GMM','🗜️ squash → PCA · 🎨🌐 visualize → t-SNE / UMAP','🃏 outliers → IsoForest · ⭕🪞 only-normal-data → OC-SVM / Autoencoder']}
 ]},

{id:'vault_deep',emoji:'⚡',color:'gold',title:'Deep Vault',tag:'VAULT · 10 TOOLS',level:2,
 desc:'CNNs to Diffusion — the heavy machinery',
 steps:[
  {t:'tool',cc:'gold',em:'👁️',name:'CNN (ResNet / EfficientNet)',sub:'The pattern-sliding eye',chips:['Images','Classification','Transfer learning'],
   best:'Image classification. <b>Fine-tune a pretrained one</b> — never start from scratch.',
   how:'Small learned filters slide across the image detecting patterns anywhere; layers stack edges → textures → parts → objects. ResNet\'s skip-connections let 100+ layers train.',
   real:'🌾 Crop-disease detection apps for farmers — fine-tuned ResNets on leaf photos.'},
  {t:'tool',cc:'gold',em:'📦',name:'YOLO / SSD / Faster R-CNN',sub:'The real-time spotter',chips:['Images/Video','Object detection','Real-time'],
   best:'Finding and <b>boxing multiple objects</b> — live if needed (YOLO), max accuracy if not (Faster R-CNN).',
   how:'YOLO looks at the image <b>once</b>, predicting all boxes and labels in a single pass — hence the speed.',
   real:'🚦 Traffic cameras counting vehicles, helmet detection, retail shelf-scanning.'},
  {t:'tool',cc:'gold',em:'🖌️',name:'U-Net / DeepLab',sub:'The pixel painter',chips:['Images','Segmentation','Per-pixel'],
   best:'When <b>every pixel</b> needs a label — outlines, not boxes.',
   how:'An encoder squeezes the image down; a decoder paints it back up, with skip-connections carrying fine detail across. Output: a full label mask.',
   real:'🫀 Tumour outlining in MRI scans — U-Net was literally invented for medical images.'},
  {t:'tool',cc:'gold',em:'🔗',name:'RNN / LSTM',sub:'The memory reader',chips:['Sequences','Time series','Streaming'],
   best:'Sequential data read step-by-step: sensor streams, time series, live audio.',
   how:'Each step feeds the next: input + a running <b>memory state</b>. LSTM adds gates deciding what to remember, forget and output — so memory survives long sequences.',
   real:'📈 Stock-tick and IoT-sensor forecasting; classic speech pipelines.'},
  {t:'tool',cc:'gold',em:'🪶',name:'GRU',sub:'The lightweight memory',chips:['Sequences','Fewer parameters','Faster'],
   best:'Same jobs as LSTM but <b>lighter and faster</b> — great when data or compute is limited.',
   how:'Merges LSTM\'s gates into two — less to learn, quicker to train, usually just as good on smaller datasets.',
   real:'⌚ On-device gesture and health-signal models inside wearables.'},
  {t:'quiz',cc:'gold',em:'🩻',q:'Radiologists need the exact outline of a tumour on each MRI slice — not just "tumour present".',tag:'Vault check',opts:[
    {em:'🖌️',txt:'U-Net',ok:true,why:'Exact outlines = per-pixel segmentation = U-Net\'s home ground.'},
    {em:'📦',txt:'YOLO',why:'YOLO draws rough boxes. Outlines need every pixel labelled — U-Net.'},
    {em:'👁️',txt:'Plain ResNet',why:'ResNet says "tumour: yes/no" for the whole image. Pixels need U-Net.'}]},
  {t:'tool',cc:'gold',em:'📖',name:'BERT / RoBERTa',sub:'The deep reader',chips:['Text','Understanding','NER · QA'],
   best:'<b>Understanding</b> tasks: classify sentiment, extract names, find answers in documents.',
   how:'Reads the whole sentence <b>in both directions at once</b>, so every word\'s meaning is shaped by full context. Fine-tunes on small datasets beautifully.',
   real:'⚖️ Contract-analysis tools extracting parties, dates and clauses from legal documents.'},
  {t:'tool',cc:'gold',em:'💬',name:'GPT / LLaMA / Claude',sub:'The generators (LLMs)',chips:['Text','Generation','Chat · reasoning'],
   best:'Open-ended generation: chat, writing, code, reasoning. <b>Prompt or fine-tune — don\'t pretrain.</b>',
   how:'Decoder-only Transformers predicting the next token, scaled to billions of parameters — then aligned with RLHF (that\'s PPO from Lesson 5!).',
   real:'🤖 ChatGPT, Claude, Gemini — and every "AI copilot" you\'ve used this year.'},
  {t:'tool',cc:'gold',em:'✂️',name:'T5 / BART',sub:'The text transformers',chips:['Text','Summarization','Translation'],

  cur=LESSONS[i];curStep=Math.min(getStep(cur.id),cur.steps.length-1);

  var wasWorld=document.body.classList.contains('world');

  $('backLbl').textContent='Journey';$('backBtn').removeAttribute('href');

  try{history.replaceState(null,'','#c='+cur.id)}catch(e){}
  if(wasWorld)doorTransition(cur.emoji,cur.tag,cur.title,C[cur.color]);
  renderStep();
}

  var h='<div class="stage'+(st.t==='comic'?' cinema':'')+'"><div class="step" id="stepBox" style="--cc:'+cc+';--cc-soft:'+ccs+'">';
  if(st.t==='comic'){
    h+='<div class="panel"><div class="rl-tag">'+(st.who==='RIO'?'🧑 Rio':'🤖 Byte')+'</div><div class="art">'+st.art+'</div>'
      +'<div class="speech"><span class="who">'+st.who+' says</span>'+st.bubble+'</div>'
      +'<div class="cap">'+st.cap+'</div></div>';
  }
  else if(st.t==='card'){
    h+='<div class="ccard"><span class="cem">'+st.em+'</span><h2>'+st.title+'</h2><div class="cbody">'+st.body+'</div></div>';
  }
  else if(st.t==='flip'){
    nb.disabled=true;stepLocked=true;
    h+='<div class="ccard" style="padding-bottom:18px"><h2 style="font-size:19px">'+st.title+'</h2><div style="font-size:12.5px;color:var(--mute);font-weight:700">'+st.sub+'</div>'
      +'<div class="tap-grid'+(st.cols===3?' cols3':'')+'">';
    st.cards.forEach(function(c,i){
      h+='<button class="flip" style="--fc:'+c.fc+'" onclick="flipCard(this)"><span class="fin">'
        +'<span class="ff"><span class="fem">'+c.em+'</span><span class="ft">'+c.ft+'</span><span class="tap-hint">TAP ME</span></span>'
        +'<span class="fb"><span><b>'+c.ft+'</b>'+c.fb.replace(/<b>(.*?)<\/b>/,'<b>$1</b><br>')+'</span></span>'
        +'</span></button>';
    });
    h+='</div></div>';
  }
  else if(st.t==='quiz'){
    nb.disabled=true;stepLocked=true;
    h+='<div class="quiz"><div class="qq"><span class="qem">'+st.em+'</span><br><span class="qtag">'+st.tag+'</span><h2>'+st.q+'</h2></div><div class="qopts">';
    st.opts.forEach(function(o,i){
      h+='<button class="qopt" data-i="'+i+'" onclick="answer(this,'+i+')"><span class="oem">'+o.em+'</span>'+o.txt+'</button>';
    });
    h+='</div><div class="qwhy" id="qwhy"></div></div>';
  }
  else if(st.t==='tool'){
    h+='<div class="tool"><div class="thead"><div class="tem">'+st.em+'</div><div><h2>'+st.name+'</h2><div class="tsub">'+st.sub+'</div></div></div>'
      +'<div class="tchips">'+st.chips.map(function(c){return '<span>'+c+'</span>'}).join('')+'</div>'
      +'<div class="tsec"><span class="tk">Best used when</span><p>'+st.best+'</p></div>'
      +'<div class="tsec"><span class="tk">How it works inside</span><p>'+st.how+'</p></div>'
      +'<div class="treal">'+st.real+'</div></div>';
  }
  else if(st.t==='sigmoid'){h+=widgetSigmoid()}
  else if(st.t==='kmeans'){h+=widgetKmeans();nb.disabled=true;stepLocked=true}
  else if(st.t==='nnet'){h+=widgetNnet();nb.disabled=true;stepLocked=true}
  else if(st.t==='rlgame'){h+=widgetRL();nb.disabled=true;stepLocked=true}
  else if(st.t==='recap'){
    h+='<div class="recap" style="--cc:'+cc+'"><span class="rem">'+st.em+'</span><h2>'+st.title+'</h2>';
    st.pts.forEach(function(p){h+='<div class="rpt"><i>✓</i><span>'+p+'</span></div>'});
    h+='</div>';
  }
  h+='</div></div>';
  $('main').innerHTML=h;
  window.scrollTo(0,0);
  if(st.t==='kmeans')kmInit();
  if(st.t==='rlgame')rlInit();
}
function nextStep(){
  if(cur===null)return;
  if(curStep>=cur.steps.length-1){
    markDone(cur.id);setStep(cur.id,0);
    snd('win');confetti(60);
    setTimeout(renderHub,900);
    return;
  }
  curStep++;setStep(cur.id,curStep);renderStep();
}
function prevStep(){if(curStep>0){curStep--;renderStep()}}

function flipCard(el){
  if(!el.classList.contains('on')){el.classList.add('on');snd('pop');burstAt(el,'✨')}
  var all=document.querySelectorAll('.flip'),flipped=document.querySelectorAll('.flip.on');
  if(all.length===flipped.length){var nb=$('nextBtn');nb.disabled=false;nb.classList.add('ready');setTimeout(function(){nb.classList.remove('ready')},500);stepLocked=false;confetti(16)}
}
var qStreak=0;
function burstAt(el,txt){
  try{var r=el.getBoundingClientRect();var b=document.createElement('div');b.className='burst-fly';b.textContent=txt;
  b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.top-6)+'px';document.body.appendChild(b);
  setTimeout(function(){b.remove()},1000)}catch(e){}
}
function showStreak(){
  var old=document.getElementById('streakChip');if(old)old.remove();
  if(qStreak<2)return;
  var c=document.createElement('div');c.id='streakChip';c.className='streak-chip';c.textContent='🔥 '+qStreak+' streak!';
  document.body.appendChild(c);
  setTimeout(function(){c.remove()},1800);
}
function answer(btn,i){
  var st=cur.steps[curStep],o=st.opts[i],why=$('qwhy');
  if(o.ok){
    btn.classList.add('right');snd('pop');
    qStreak++;
    document.querySelectorAll('.qopt').forEach(function(b){b.disabled=true});
    why.className='qwhy show';why.innerHTML='🎉 <b>Correct!</b> '+o.why;
    burstAt(btn,['✨','🎯','💪','🌟','🚀'][Math.floor(Math.random()*5)]+' +1');
    confetti(Math.min(34,10+qStreak*6));
    showStreak();
    var nb=$('nextBtn');nb.disabled=false;nb.classList.add('ready');setTimeout(function(){nb.classList.remove('ready')},500);
    stepLocked=false;
  }else{
    btn.classList.add('wrong');btn.disabled=true;snd('nope');
    qStreak=0;
    document.body.classList.add('shake-sm');setTimeout(function(){document.body.classList.remove('shake-sm')},400);
    why.className='qwhy oops show';why.innerHTML='🤔 '+o.why;
    setTimeout(function(){btn.classList.remove('wrong')},500);
  }
}

/* ══════════════ WIDGETS ══════════════ */
function widgetSigmoid(){
  return '<div class="widget"><h2>🏦 The Loan-o-meter</h2><div class="wsub">Drag the slider — you\'re the algorithm now!</div>'
   +'<div style="font-size:13px;font-weight:800;margin-bottom:2px">Missed payments: <span id="sgN">0</span></div>'
   +'<input type="range" min="0" max="10" value="0" oninput="sgUpd(this.value)">'
   +'<div style="margin:8px 0 2px;font-size:44px" id="sgFace">😎</div>'
   +'<div class="bigread" id="sgP" style="color:var(--green)">4%</div>'
   +'<div style="font-size:12px;font-weight:800;color:var(--mute)">chance of default</div>'
   +'<svg viewBox="0 0 300 90" style="max-width:340px;margin:10px auto 0;display:block">'
   +'<line x1="20" y1="75" x2="280" y2="75" stroke="#d8cfc8" stroke-width="2"/>'
   +'<path d="M25 73 C 110 71 130 18 275 15" fill="none" stroke="#a53c36" stroke-width="3.5" stroke-linecap="round"/>'
   +'<circle id="sgDot" cx="25" cy="73" r="8" fill="#a53c36" stroke="#fff" stroke-width="3"/></svg>'
   +'<div class="wnote">💡 The S-curve squeezes ANY score into a 0-100% probability. That\'s the heart of <b>Logistic Regression</b>.</div></div>';
}
function sgUpd(v){
  v=+v;$('sgN').textContent=v;
  var z=(v-4.2)*1.1,p=1/(1+Math.exp(-z));
  var pct=Math.round(p*100);
  $('sgP').textContent=pct+'%';
  $('sgP').style.color=pct<25?'var(--green)':pct<60?'var(--gold)':'var(--red)';
  $('sgFace').textContent=pct<25?'😎':pct<45?'🙂':pct<60?'😬':pct<80?'😰':'🚨';
  var t=v/10,x=25+t*250;
  var z2=(v-4.2)*1.1,y=73-(1/(1+Math.exp(-z2)))*58;
  var d=$('sgDot');d.setAttribute('cx',x);d.setAttribute('cy',y);
}
/* K-Means widget */
var km={pts:[],cents:[],round:0};
function widgetKmeans(){
  return '<div class="widget"><h2>⛺ The Tent-Pole Game</h2><div class="wsub">3 tent poles land randomly. Run rounds and watch them find the real groups — like Netflix finding taste tribes.</div>'
   +'<svg id="kmSvg" viewBox="0 0 300 190" style="max-width:360px;display:block;margin:0 auto;background:var(--soft);border-radius:16px"></svg>'
   +'<div style="margin-top:14px"><button class="wbtn" id="kmBtn" onclick="kmRound()">Run round 1 ▶</button></div>'
   +'<div class="wnote" id="kmNote">💡 Every dot is a customer. Poles = cluster centres.</div></div>';
}
function kmInit(){
  km.round=0;km.pts=[];km.cents=[[150,60],[150,95],[150,130]];
  var groups=[[70,55],[225,60],[150,145]];
  groups.forEach(function(g){
    for(var i=0;i<8;i++){km.pts.push([g[0]+(Math.random()*56-28),g[1]+(Math.random()*44-22),0])}
  });
  kmDraw();
}
function kmAssign(){km.pts.forEach(function(p){var best=0,bd=1e9;km.cents.forEach(function(c,i){var d=(p[0]-c[0])*(p[0]-c[0])+(p[1]-c[1])*(p[1]-c[1]);if(d<bd){bd=d;best=i}});p[2]=best})}
function kmMove(){km.cents.forEach(function(c,i){var xs=0,ys=0,n=0;km.pts.forEach(function(p){if(p[2]===i){xs+=p[0];ys+=p[1];n++}});if(n){c[0]=xs/n;c[1]=ys/n}})}
function kmDraw(){
  var cols=['#1d9d74','#e08914','#7c4dc4'];
  var s='';
  km.pts.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6.5" fill="'+(km.round===0?'#a8a09a':cols[p[2]])+'" style="transition:fill .5s"/>'});
  km.cents.forEach(function(c,i){s+='<g style="transition:transform .8s" transform="translate('+c[0]+','+c[1]+')"><circle r="11" fill="none" stroke="'+cols[i]+'" stroke-width="3.5"/><circle r="3" fill="'+cols[i]+'"/></g>'});
  $('kmSvg').innerHTML=s;
}
function kmRound(){
  km.round++;kmAssign();kmMove();kmDraw();snd('pop');
  var b=$('kmBtn'),n=$('kmNote');
  if(km.round===1){b.textContent='Run round 2 ▶';n.innerHTML='👀 Every customer joined its nearest pole — and the poles moved to the middle of their crowd!'}
  else if(km.round===2){b.textContent='Run round 3 ▶';n.innerHTML='🔥 Poles are settling into the real groups…'}
  else{b.textContent='Converged! ✓';b.disabled=true;n.innerHTML='🎉 Nobody switches anymore — <b>3 tribes found, zero labels used.</b> That\'s K-Means!';$('nextBtn').disabled=false;stepLocked=false;confetti(24)}
}
/* NNet widget */
var nnRan=false;
function widgetNnet(){
  nnRan=false;
  return '<div class="widget"><h2>🧠 Fire the Neural Net</h2><div class="wsub">Send a photo through the layers and watch the signal flow.</div>'
   +'<svg id="nnSvg" viewBox="0 0 320 160" style="max-width:380px;display:block;margin:0 auto">'
   +'<text x="28" y="86" font-size="30" text-anchor="middle">👟</text>'
   +'<g stroke="#ddd3cb" stroke-width="1.6" id="nnLines">'
   +'<line x1="45" y1="80" x2="105" y2="40"/><line x1="45" y1="80" x2="105" y2="80"/><line x1="45" y1="80" x2="105" y2="120"/>'
   +'<line x1="115" y1="40" x2="185" y2="55"/><line x1="115" y1="80" x2="185" y2="55"/><line x1="115" y1="120" x2="185" y2="105"/>'
   +'<line x1="115" y1="40" x2="185" y2="105"/><line x1="115" y1="80" x2="185" y2="105"/><line x1="115" y1="120" x2="185" y2="55"/>'
   +'<line x1="195" y1="55" x2="258" y2="80"/><line x1="195" y1="105" x2="258" y2="80"/></g>'
   +'<g fill="#e08914"><circle cx="110" cy="40" r="9"/><circle cx="110" cy="80" r="9"/><circle cx="110" cy="120" r="9"/></g>'
   +'<g fill="#c88a3f"><circle cx="190" cy="55" r="9"/><circle cx="190" cy="105" r="9"/></g>'
   +'<circle cx="262" cy="80" r="11" fill="#2b2624"/>'
   +'<text id="nnOut" x="262" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d9d74" opacity="0">SNEAKER 97%</text>'
   +'</svg>'
   +'<div style="margin-top:12px"><button class="wbtn" onclick="nnFire(this)">📸 Show it the photo</button></div>'
   +'<div class="wnote" id="nnNote">Each circle = a tiny judge that weighs its inputs and fires.</div></div>';
}
function nnFire(btn){
  btn.disabled=true;snd('pop');
  var svg=$('nnSvg');
  for(var i=0;i<3;i++){(function(i){
    setTimeout(function(){
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r','5');c.setAttribute('fill','#e08914');
      var m=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
      m.setAttribute('path','M45 80 L110 '+(40+i*40)+' L190 '+(i===2?105:55)+' L262 80');
      m.setAttribute('dur','1.1s');m.setAttribute('fill','freeze');
      c.appendChild(m);svg.appendChild(c);
      setTimeout(function(){c.remove()},1300);
    },i*160)})(i)}
  setTimeout(function(){
    $('nnOut').setAttribute('opacity','1');snd('win');
    $('nnNote').innerHTML='🎉 <b>SNEAKER — 97% sure!</b> When it\'s wrong during training, the error flows <b>backwards</b> nudging every judge — that\'s backpropagation.';
    $('nextBtn').disabled=false;stepLocked=false;
    btn.textContent='Again? 📸';btn.disabled=false;
  },1500);
}
/* RL grid game */
var rl={pos:0,score:0,steps:0,done:false};
var RL_PITS=[6,9],RL_GOAL=11,RL_START=4;
function widgetRL(){
  return '<div class="widget"><h2>🤖 Guide the Robot!</h2><div class="wsub">Reach 📦 · avoid 🕳️ · every step costs 1 point. YOU are the agent now.</div>'
   +'<div class="rlgrid" id="rlGrid"></div>'
   +'<div class="rlscore"><span>🏆 <b id="rlScore">0</b> pts</span><span>👣 <b id="rlSteps">0</b> steps</span></div>'
   +'<div class="dpad"><i></i><button onclick="rlMove(-4)">⬆️</button><i></i><button onclick="rlMove(-1)">⬅️</button><button onclick="rlReset()" style="font-size:14px">↺</button><button onclick="rlMove(1)">➡️</button><i></i><button onclick="rlMove(4)">⬇️</button><i></i></div>'
   +'<div class="wnote" id="rlNote">💡 Rewards: step −1 · pit −20 · package +50</div></div>';
}
function rlInit(){rl.pos=RL_START;rl.score=0;rl.steps=0;rl.done=false;rlDraw()}
function rlReset(){rlInit();$('rlNote').innerHTML='💡 Rewards: step −1 · pit −20 · package +50'}
function rlDraw(){
  var h='';
  for(var i=0;i<16;i++){
    var inner='';
    if(i===rl.pos)inner='🤖';else if(i===RL_GOAL&&!rl.done)inner='📦';else if(RL_PITS.indexOf(i)>-1)inner='🕳️';
    h+='<div class="rlcell'+(i===rl.pos?' robot':'')+'">'+inner+'</div>';
  }
  $('rlGrid').innerHTML=h;
  $('rlScore').textContent=rl.score;$('rlSteps').textContent=rl.steps;
}
function rlMove(d){
  if(rl.done)return;
  var p=rl.pos,np=p+d;
  if(d===-1&&p%4===0)return;if(d===1&&p%4===3)return;
  if(np<0||np>15)return;
  rl.pos=np;rl.steps++;rl.score-=1;
  if(RL_PITS.indexOf(np)>-1){rl.score-=20;snd('nope');$('rlNote').innerHTML='💥 <b>−20!</b> The robot remembers: that square is BAD. (This is exactly what a Q-table stores.)';rl.pos=RL_START}
  else if(np===RL_GOAL){rl.score+=50;rl.done=true;snd('win');confetti(30);
    $('rlNote').innerHTML='🎉 <b>+50! Package delivered in '+rl.steps+' steps.</b> A real agent replays this thousands of times until it finds the shortest safe path — that\'s Q-Learning.';
    $('nextBtn').disabled=false;stepLocked=false;}
  else{snd('pop')}
  rlDraw();
}

/* ══════════════ DECISION ENGINE ══════════════ */
var engTrail=[];
function startEngine(){
  engineOn=true;cur=null;engTrail=[];
  var wasWorld=document.body.classList.contains('world');
  document.body.classList.remove('world');
  $('foot').style.display='none';
  $('backLbl').textContent='Journey';$('backBtn').removeAttribute('href');
  $('topBar').style.width='100%';$('topCnt').textContent='⚙️';
  try{history.replaceState(null,'','#engine')}catch(e){}
  if(wasWorld)doorTransition('⚙️','FINALE','The Decision Engine',C.sky);
  engRender('start');
}
function engRender(node){
  var n=ENGINE[node];
  var h='<div class="stage"><div class="step">';
  h+='<div class="crumbs">'+engTrail.map(function(c){return '<span class="crumb">'+c+'</span>'}).join('')+'</div>';
  h+='<div class="quiz"><div class="qq"><span class="qem">'+n.em+'</span><br><span class="qtag" style="background:var(--sky-soft);color:var(--sky)">Decision Engine</span><h2>'+n.q+'</h2></div><div class="qopts">';
  n.opts.forEach(function(o,i){h+='<button class="qopt" onclick="engPick(\''+node+'\','+i+')"><span class="oem">'+o.em+'</span>'+o.t+'</button>'});
  h+='</div>';
  if(engTrail.length)h+='<div style="text-align:center;margin-top:16px"><button class="wbtn" style="--cc:var(--sky);background:var(--card);color:var(--ink);box-shadow:var(--sh)" onclick="startEngine()">↺ Start over</button></div>';
  h+='</div></div></div>';
  $('main').innerHTML=h;window.scrollTo(0,0);
}
function engPick(node,i){
  var o=ENGINE[node].opts[i];snd('pop');
  if(o.crumb)engTrail.push(o.crumb);
  if(o.next){engRender(o.next);return}
  var v=o.v;
  markDone('engine');snd('win');confetti(50);
  var h='<div class="stage"><div class="step">';
  h+='<div class="crumbs">'+engTrail.map(function(c){return '<span class="crumb">'+c+'</span>'}).join('')+'</div>';
  h+='<div class="ccard"><div class="verdict-band" style="background:'+v.c+'">'+v.f+'</div>'
    +'<div style="font-family:var(--mono);font-weight:700;font-size:15px;margin-bottom:10px">'+v.a+'</div>'
    +'<div class="cbody"><p>'+v.w+'</p></div>'
    +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">'
    +'<button class="wbtn" style="background:'+v.c+'" onclick="startEngine()">↺ Another problem</button>'
    +'<button class="wbtn" style="background:var(--card);color:var(--ink);box-shadow:var(--sh)" onclick="engineOn=false;renderHub()">🏠 Lessons</button>'
    +'</div></div></div></div>';
  $('main').innerHTML=h;window.scrollTo(0,0);
}

/* ══════════════ BOOT (deep links: #c=<chapter> / #engine) ══════════════ */
function routeFromHash(){
  var m=location.hash.match(/^#c=([a-z_]+)$/);
  if(location.hash==='#engine'){startEngine();return}
  if(m){
    for(var i=0;i<LESSONS.length;i++){
      if(LESSONS[i].id===m[1]){startLesson(i);return}
    }
  }
  renderHub();
}
window.addEventListener('hashchange',function(){
  var m=location.hash.match(/^#c=([a-z_]+)$/);
  var target=m?m[1]:(location.hash==='#engine'?'engine':null);
  var here=engineOn?'engine':(cur?cur.id:null);
  if(target!==here)routeFromHash();
});
routeFromHash();
</script>
