<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Python · Brodoit</title>
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=16">
<link rel="stylesheet" href="/code/assets/code.css?v=5">
</head>
<body class="py-school pl">
<header class="pl-top">
  <a class="pl-x" href="/code/" aria-label="Back to all days"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
  <div class="pl-mid"><div class="pl-day"><span id="dayLabel">Day</span><span class="pl-py" id="pyst" data-s="cold" role="status" aria-label="Starting Python" title="Starting Python"><i></i></span></div><div class="pl-segs" id="segs"></div></div>
  <span class="pl-xp" id="xp">0 XP</span>
  <button class="pl-voice" id="voice" aria-label="Narration on"></button>
</header>
<main class="pl-stage" id="stage" aria-live="polite"></main>
<footer class="pl-foot" id="foot">
  <button class="pl-back" id="back" aria-label="Previous slide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="pl-fmid"><button class="pl-next" id="next">Continue</button><button class="pl-skip" id="skip" hidden>Skip</button></div>
  <button class="pl-bro" id="bro" aria-label="Ask Bro"></button>
</footer>
<script type="module" src="/code/assets/player.js?v=4"></script>
</body>
</html>
