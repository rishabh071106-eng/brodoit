<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Python · Brodoit</title>
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/app/fonts/fonts.css">
<link rel="stylesheet" href="/app/theme.css?v=16">
<link rel="stylesheet" href="/code/assets/code.css?v=7">
<script src="/app/sound.js"></script>
<script src="/app/mascot.js"></script>
</head>
<body class="py-school pl">
<header class="pl-top">
  <a class="pl-x" href="/code/" aria-label="Quit to the map"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
  <div class="pl-mid">
    <div class="pl-segs" id="segs" role="img" aria-label="Level progress"></div>
    <div class="pl-sub"><span class="pl-stg" id="stageLabel"></span><span class="pl-py" id="pyst" data-s="cold" role="status" aria-label="Starting Python" title="Starting Python"><i></i></span><span class="pl-combo" id="combo" role="status"></span></div>
  </div>
  <span class="pl-xp" id="xp" role="status" aria-label="XP this level"></span>
  <button class="pl-snd" id="snd" aria-label="Sound on" aria-pressed="true"></button>
</header>
<main class="pl-stage" id="stage" aria-live="polite"></main>
<footer class="pl-foot" id="foot">
  <div class="pl-fb" id="fb" role="status" hidden></div>
  <div class="pl-frow">
    <button class="pl-back" id="back" aria-label="Previous step"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="pl-next" id="next">Continue</button>
    <button class="pl-bro" id="bro" aria-label="Ask Bro"></button>
  </div>
</footer>
<script type="module" src="/code/assets/player.js?v=6"></script>
</body>
</html>
