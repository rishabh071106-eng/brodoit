<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Countdown — Brodoit Prep</title>
<meta name="theme-color" content="#F6F5F2">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=12">
<link rel="stylesheet" href="assets/app.css?v=12">
<script src="/app/icons.js?v=12" defer></script>
<style>
  .cd{border-radius:var(--r-xl);padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-top:12px}
  .cd .big{display:flex;align-items:baseline;gap:8px}
  .cd .big b{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1}
  .cd .big span{font-size:16px;font-weight:800;opacity:.9}
  .cd .units{display:flex;gap:8px;margin-top:12px}
  .cd .units div{flex:1;background:rgba(255,255,255,.16);border-radius:var(--r-sm);padding:9px;text-align:center}
  .cd .units b{display:block;font-size:20px;font-weight:800}
  .cd .units small{font-size:11px;font-weight:700;opacity:.85}
  .cd .del{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
  .cd .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
  .cd .bar i{display:block;height:100%;background:#fff;border-radius:6px}
  .cd .tip{font-size:13px;font-weight:600;opacity:.92;margin-top:10px}
  .form{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-top:14px}
  .form label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
  .form input,.form select{width:100%;min-height:44px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card-2);color:var(--ink);font:600 15px var(--font)}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="h-xl rise" style="margin:6px 0 4px">Exam<br>countdown <span data-ico="hourglass" data-size="34" style="vertical-align:-4px;color:var(--accent)"></span></h1>
  <p class="muted" style="font-weight:600">Set the date of your exam. We'll show the days left here, on your Prep home and in the app's Learn tab.</p>
  <div id="list"></div>
  <form class="form" id="add">
    <div class="h-md">Add an exam</div>
    <label>Exam</label><select name="exam" id="exam"></select>
    <div id="customWrap" hidden><label>Exam name</label><input name="custom" maxlength="60" placeholder="e.g. Class 12 Boards"></div>
    <label>Exam date</label><input type="date" name="date" required>
    <button class="btn btn-accent btn-block press" style="margin-top:16px">Start countdown</button>
  </form>
</main>
<script type="module">
import { renderChrome, loadCatalog, store, esc, toast, examCountdowns, setExamDate, removeExamDate } from './assets/js/app.js?v=9';
import { ic, hydrateIcons } from './assets/js/ico.js?v=12';
renderChrome({ active: '', title: 'Exam countdown' });
hydrateIcons();

const cat = await loadCatalog();
const sel = document.getElementById('exam');
sel.innerHTML = cat.categories.map(c => `<optgroup label="${esc(c.name)}">${c.exams.filter(e => !/core$/.test(e.id)).map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</optgroup>`).join('')
  + '<option value="custom">Other exam…</option>';
const pre = new URLSearchParams(location.search).get('exam');
if (pre) sel.value = pre;
sel.onchange = () => { document.getElementById('customWrap').hidden = sel.value !== 'custom'; };
const nameOf = id => cat.categories.flatMap(c => c.exams).find(e => e.id === id)?.name || id;

const TIPS = [[0, 'Exam day! Sleep well, carry your admit card and ID. You\'ve got this.'], [7, 'Final week: revise notes and quick-revision lists only — no new topics.'],
  [30, 'One month: one full mock test every other day, analyse every mistake.'], [90, 'Three months: finish the syllabus now, start weekly mocks and past papers.'],
  [Infinity, 'Plenty of time: build the base — one lesson a day keeps your streak alive.']];
const GRADS = ['var(--c-ssb)', 'var(--c-me)', '#0F766E', 'var(--c-it)']; // solid: the countdown cards are not heroes

function draw() {
  const list = examCountdowns();
  document.getElementById('list').innerHTML = list.length ? list.map((x, i) => {
    const weeks = Math.floor(x.days / 7), months = (x.days / 30.4).toFixed(1);
    const total = Math.max(1, Math.round((Date.parse(x.date) - x.setAt) / 864e5));
    const pct = x.days < 0 ? 100 : Math.min(100, Math.max(0, 100 - (x.days / total) * 100));
    return `<div class="cd" style="background:${GRADS[i % GRADS.length]}">
      <button class="del press" data-del="${esc(x.key)}" aria-label="Remove">${ic('x', 18)}</button>
      <div class="eyebrow" style="opacity:.85">${esc(x.name)}</div>
      <div class="big"><b>${x.days < 0 ? '✓' : x.days}</b><span>${x.days < 0 ? 'Exam is over' : x.days === 1 ? 'day left' : 'days left'}</span></div>
      <div style="font-weight:700;opacity:.9">${new Date(x.date + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
      ${x.days >= 0 ? `<div class="units"><div><b>${weeks}</b><small>weeks</small></div><div><b>${months}</b><small>months</small></div><div><b>${x.days * 2}</b><small>study hours at 2/day</small></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="tip">${ic('lightbulb', 14)} ${TIPS.find(([d]) => x.days <= d)[1]}</div>` : ''}
      ${x.examId ? `<a class="btn press" style="background:#fff;color:#0E0E10;margin-top:12px;padding:10px 16px;font-size:13px" href="exam.html?id=${x.examId}">Open ${esc(x.name)} lessons →</a>` : ''}
    </div>`;
  }).join('') : '';
}
document.getElementById('list').addEventListener('click', e => {
  const k = e.target.dataset.del; if (!k) return;
  if (confirm('Remove this countdown?')) { removeExamDate(k); draw(); }
});
document.getElementById('add').onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target), id = f.get('exam');
  const name = id === 'custom' ? (f.get('custom') || '').trim() : nameOf(id);
  if (!name) return toast('Type the exam name');
  setExamDate(id === 'custom' ? 'custom-' + Date.now() : id, { name, date: f.get('date'), examId: id === 'custom' ? null : id });
  e.target.reset(); sel.value = id; draw(); toast('Countdown started ⏳'); scrollTo({ top: 0, behavior: 'smooth' });
};
draw();
</script>
</body>
</html>
