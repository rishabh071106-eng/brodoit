<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Government Job — Brodoit</title>
<meta name="theme-color" content="#F6F5F2">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=14">
<link rel="stylesheet" href="assets/app.css?v=14">
<link rel="stylesheet" href="/lang/assets/topbar.css?v=14">
<script src="/app/icons.js?v=14" defer></script>
<script src="/lang/assets/topbar.js?v=14" defer></script>
<style id="jobcss"></style>
<style>
  body{padding-bottom:calc(var(--tabbar) + 90px + env(safe-area-inset-bottom))}
  .dh{border-radius:var(--r-xl);padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
  .dh .big{position:absolute;right:-8px;top:-10px;font-size:110px;opacity:.2}
  .dh .org{font-size:13px;font-weight:800;opacity:.9}
  .dh h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:6px 0 12px}
  .dh .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dh .row2 span{background:rgba(255,255,255,.2);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .fact{background:var(--card);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--shadow)}
  .fact span{font-size:11px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .dh .row2 i.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);margin-right:4px;vertical-align:middle}
  .dh .row2 i.dot.on{background:#4ADE80;box-shadow:0 0 8px #4ADE80}
  .block h2{display:flex;align-items:center;gap:8px}
  .fact b{display:block;font-size:15px;font-weight:800;margin-top:3px;line-height:1.3}
  .fact.wide{grid-column:1 / -1}
  .block{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-top:12px}
  .block h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
  .block p{font-size:15px;line-height:1.6;color:var(--ink-2)}
  .steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .steps li{counter-increment:s;display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--ink-2);position:relative}
  .steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
  .stages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .stages span{background:var(--card-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
  .stages i{color:var(--mute);font-style:normal}
  .doc{display:flex;gap:10px;align-items:center;min-height:44px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
  .doc:last-child{border-bottom:none}
  .doc input{width:20px;height:20px;accent-color:var(--ok)}
  .cta{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom));z-index:45;padding:0 14px}
  .cta div{max-width:720px;margin:0 auto;display:flex;gap:8px}
  .cta .apply{flex:1;box-shadow:0 14px 30px rgba(255,90,31,.4)}
  .cta .wa{background:#25D366;color:#fff;border-radius:999px;width:54px;display:grid;place-items:center;box-shadow:0 14px 30px rgba(37,211,102,.35)}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .links a,.links button{flex:1;min-width:140px;padding:12px;font-size:13px}
  .warn{background:color-mix(in srgb,var(--warn) 16%,var(--card));border-radius:var(--r-md);padding:12px 14px;font-size:13px;color:var(--ink-2);margin-top:12px}
</style>
</head>
<body>
<main class="wrap" id="main"><div class="muted" style="padding:40px;text-align:center">Loading…</div></main>
<div class="cta" id="cta" hidden><div><a class="btn btn-accent apply press" id="applyBtn" target="_blank" rel="noopener">Apply on official site <span data-ico="external-link" data-size="16"></span></a><a class="wa press" id="waBtn" target="_blank" rel="noopener" aria-label="Share on WhatsApp"></a></div></div>

<script type="module">
import { renderChrome, esc, toast } from './assets/js/app.js?v=9';
import { CAT, JOB_CSS, jobCard, daysLeft, fmtDate, ageText, whatsappUrl, shareText, WA_ICON } from './assets/js/jobs-common.js?v=9';
import { ic, hydrateIcons } from './assets/js/ico.js?v=14';
document.getElementById('jobcss').textContent = JOB_CSS;
renderChrome({ active: '', title: 'Jobs', back: 'jobs.html' });
hydrateIcons();
const CAT_ICO = { central: 'landmark', defence: 'medal', police: 'shield', banking: 'building-2', railways: 'train-front', teaching: 'book-open', psu: 'factory', state: 'map', health: 'stethoscope', other: 'mailbox' };
const BY_EMOJI = Object.fromEntries(Object.entries(CAT).map(([k, c]) => [c.emoji, k]));
const swapJav = root => root.querySelectorAll('.jav').forEach(el => { const k = BY_EMOJI[el.textContent.trim()]; if (k) el.innerHTML = ic(CAT_ICO[k] || 'briefcase', 22); });

const id = new URLSearchParams(location.search).get('id');
const main = document.getElementById('main');
const r = await fetch('/api/jobs/' + encodeURIComponent(id)).then(r => r.ok ? r.json() : null).catch(() => null);
if (!r) { main.innerHTML = `<div class="block" style="text-align:center"><div style="font-size:44px">🗂️</div><h2>This job is no longer listed</h2><p>It may be older than 3 months. See today's list instead.</p><a class="btn btn-dark press" style="margin-top:12px" href="jobs.html">All government jobs</a></div>`; throw new Error('missing'); }
const j = r.job, cat = CAT[j.category] || CAT.other, d = daysLeft(j);
document.title = `${j.title} — Brodoit Jobs`;

const status = !j.open ? 'Closed' : d === null ? 'Open' : d === 0 ? 'Last day today' : `${d} day${d > 1 ? 's' : ''} left`;
const fact = (k, v, wide) => v ? `<div class="fact${wide ? ' wide' : ''}"><span>${k}</span><b>${esc(v)}</b></div>` : '';
main.innerHTML = `
  <section class="dh rise" style="background:linear-gradient(140deg,${cat.c} 0%,${cat.c}CC 60%,#FFC24B 140%)">
    <div class="big">${cat.emoji}</div>
    <div class="org">${esc(j.org)}</div>
    <h1>${esc(j.title)}</h1>
    <div class="row2"><span><i class="dot${j.open ? ' on' : ''}"></i> ${status}</span><span>${ic(CAT_ICO[j.category] || 'briefcase', 14)} ${cat.name}</span>${j.posts ? `<span>${ic('users', 14)} ${j.posts.toLocaleString('en-IN')} posts</span>` : ''}</div>
  </section>
  <div class="facts">
    ${fact('Last date', fmtDate(j.lastDate))}${fact('Notified on', fmtDate(j.postedDate))}
    ${fact('Age limit', ageText(j))}${fact('Qualification', j.qualification || 'See notice')}
    ${fact('Application fee', j.fee, true)}${fact('Salary', j.salary, true)}${fact('Exam date', j.examDate)}${fact('Location', j.location)}
  </div>
  ${j.about ? `<div class="block"><h2>${ic('pin', 18)} About this job</h2><p>${esc(j.about)}</p></div>` : ''}
  ${j.qualificationDetail || j.ageNote ? `<div class="block"><h2>${ic('check-circle', 18)} Who can apply</h2>${j.qualificationDetail ? `<p>${esc(j.qualificationDetail)}</p>` : ''}${j.ageNote ? `<p style="margin-top:8px"><b>Age:</b> ${esc(ageText(j))}. ${esc(j.ageNote)}</p>` : ''}</div>` : ''}
  ${j.steps?.length ? `<div class="block"><h2>${ic('pen-line', 18)} How to apply</h2><ol class="steps">${j.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol></div>` : ''}
  ${j.selection?.length ? `<div class="block"><h2>${ic('target', 18)} Selection process</h2><div class="stages">${j.selection.map(s => `<span>${esc(s)}</span>`).join('<i>→</i>')}</div></div>` : ''}
  ${j.documents?.length ? `<div class="block"><h2>${ic('paperclip', 18)} Keep these ready</h2><div id="docs">${j.documents.map((x, i) => `<label class="doc"><input type="checkbox" data-i="${i}"><span>${esc(x)}</span></label>`).join('')}</div></div>` : ''}
  <div class="links">
    <a class="btn btn-ghost press" href="${esc(j.officialUrl)}" target="_blank" rel="noopener">${ic('file-text', 16)} Official notification</a>
    <button class="btn btn-ghost press" id="copy">${ic('link', 16)} Copy share link</button>
  </div>
  <div class="warn">${ic('alert-triangle', 16)} Always confirm dates, fees and eligibility in the official notification on <b>${esc(j.sourceName || 'the official site')}</b> before you pay or apply. Brodoit never charges for jobs.</div>
  <div class="section"><div class="h-md">More ${cat.name} jobs</div><a href="jobs.html#${j.category}">See all</a></div>
  <div id="more"></div>`;

const apply = document.getElementById('applyBtn');
apply.href = j.applyUrl || j.officialUrl;
if (!j.open) apply.textContent = 'Closed — view official site ↗';
document.getElementById('waBtn').href = whatsappUrl(j);
document.getElementById('waBtn').innerHTML = WA_ICON;
document.getElementById('cta').hidden = false;
document.getElementById('copy').onclick = async () => {
  const link = `${location.origin}/j/${encodeURIComponent(j.id)}`;
  try {
    if (navigator.share) await navigator.share({ title: `${j.title} — Brodoit`, text: shareText(j) });
    else { await navigator.clipboard.writeText(link); toast('Link copied'); }
  } catch {}
};
// Document checklist remembered per job on this device.
const dk = 'jobs.docs.' + j.id;
let got = {}; try { got = JSON.parse(localStorage.getItem(dk) || '{}'); } catch {}
document.querySelectorAll('#docs input').forEach(i => { i.checked = !!got[i.dataset.i]; });
document.getElementById('docs')?.addEventListener('change', e => { got[e.target.dataset.i] = e.target.checked; try { localStorage.setItem(dk, JSON.stringify(got)); } catch {} });

const all = await fetch('/api/jobs').then(r => r.json()).catch(() => ({ jobs: [] }));
const more = (all.jobs || []).filter(x => x.category === j.category && x.id !== j.id && x.open).slice(0, 4);
document.getElementById('more').innerHTML = more.length ? more.map(jobCard).join('') : '<p class="muted">No other open jobs in this category right now.</p>';
swapJav(document.getElementById('more'));
</script>
</body>
</html>
