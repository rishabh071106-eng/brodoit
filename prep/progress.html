<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Board — Brodoit Prep</title>
<meta name="theme-color" content="#F6F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  .board{border-radius:var(--r-xl);padding:22px;color:#fff;background:var(--g-me);position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
  .board .big-ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex-shrink:0}
  .board .big-ring > div{width:96px;height:96px;border-radius:50%;background:rgba(14,14,16,.25);backdrop-filter:blur(6px);display:grid;place-items:center;text-align:center}
  .chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding:16px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
  .chart i{width:100%;max-width:22px;border-radius:6px;min-height:4px;background:var(--card-2)}
  .chart i.on{background:var(--accent)}
  .chart small{font-size:9.5px;color:var(--mute);font-weight:700}
  .stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sticker{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px 8px;text-align:center;font-size:12px;font-weight:700}
  .sticker .e{font-size:30px;filter:grayscale(1);opacity:.35}
  .sticker.got .e{filter:none;opacity:1}
  .sticker:not(.got){color:var(--mute)}
  .exam-p{display:flex;align-items:center;gap:12px}
  .bar2{flex:1;height:8px;border-radius:8px;background:var(--card-2);overflow:hidden}
  .bar2 i{display:block;height:100%;border-radius:8px}
</style>
</head>
<body>
<main class="wrap">
  <section class="board rise" id="board"></section>
  <div class="stat-grid rise" style="margin-top:12px" id="stats"></div>

  <div class="section"><div class="h-md">Last 14 days</div><span class="muted" style="font-size:12px;font-weight:700">minutes / day</span></div>
  <div class="chart" id="chart"></div>

  <div class="section"><div class="h-md">Badges</div></div>
  <div class="stickers" id="badges"></div>

  <div class="section"><div class="h-md">Exam progress</div></div>
  <div id="exams"></div>

  <div class="section"><div class="h-md">Activity</div></div>
  <div id="feed"></div>

  <div class="section"><div class="h-md">Backup</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-ghost press" id="export">⬇ Export</button>
    <label class="btn btn-ghost press">⬆ Import<input type="file" id="import" accept="application/json" hidden></label>
    <button class="btn btn-ghost press" id="reset" style="color:var(--bad)">Reset</button>
  </div>
</main>
<script type="module">
import { renderChrome, loadCatalog, loadExam, examChapters, store, streak, esc, fmtMinutes, timeAgo } from './assets/js/app.js';
renderChrome({ active: 'progress.html', title: 'My Board' });

const s = store.read();
const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
const done = Object.values(s.completed);
const quizzed = done.filter(d => d.total);
const quizPct = quizzed.length ? Math.round(100 * quizzed.reduce((a, d) => a + d.score, 0) / quizzed.reduce((a, d) => a + d.total, 0)) : null;
const st = streak(s.days), listened = sum(s.listen), studied = sum(s.study) + listened;
const drills = (s.drills || []).length, ssbSeen = Object.keys(s.ssbSeen || {}).length;

const cat = await loadCatalog();
const ids = cat.categories.flatMap(c => c.exams.map(e => ({ ...e, c })));
const loaded = (await Promise.all(ids.map(e => loadExam(e.id).then(x => ({ e, x }), () => null)))).filter(Boolean);
const totalCh = loaded.reduce((a, { x }) => a + examChapters(x).length, 0);
const pct = totalCh ? Math.round((done.length / totalCh) * 100) : 0;

document.getElementById('board').innerHTML = `
  <div style="display:flex;gap:18px;align-items:center">
    <div class="big-ring" style="--p:${Math.max(pct, 2)}"><div><div style="font-size:30px;font-weight:800;line-height:1">${done.length}</div><div style="font-size:11px;font-weight:700;opacity:.9">lessons</div></div></div>
    <div><div class="eyebrow" style="opacity:.85">Your board</div>
      <div class="h-lg" style="font-size:26px;margin-top:4px">${st ? `🔥 ${st}-day streak` : 'Start a streak today'}</div>
      <div style="font-weight:600;opacity:.92;margin-top:4px">${fmtMinutes(studied)} studied · ${fmtMinutes(listened)} listened</div></div>
  </div>`;

document.getElementById('stats').innerHTML = [
  [quizPct === null ? '—' : quizPct + '%', 'Quiz accuracy'],
  [drills, 'SSB drills done'],
  [`${ssbSeen}/11`, 'SSB stages explored'],
  [(s.companies || []).filter(c => c.done).length + '/' + (s.companies || []).length, 'Target companies cleared'],
].map(([b, l]) => `<div class="stat"><b>${b}</b><span>${l}</span></div>`).join('');

const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 13 + i); return d; });
const mins = days.map(d => Math.round((s.days[d.toISOString().slice(0, 10)] || 0) / 60));
const max = Math.max(10, ...mins);
document.getElementById('chart').innerHTML = days.map((d, i) =>
  `<div title="${mins[i]} min"><small>${mins[i] || ''}</small><i class="${mins[i] ? 'on' : ''}" style="height:${Math.max(4, (mins[i] / max) * 80)}px"></i><small>${d.getDate()}</small></div>`).join('');

const longest = (() => { let best = 0, run = 0, prev = null;
  for (const k of Object.keys(s.days).sort()) { const d = new Date(k); run = prev && (d - prev) / 864e5 === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best; })();
const B = [
  ['🌱', 'First lesson', done.length >= 1], ['📗', '10 lessons', done.length >= 10], ['🏆', '50 lessons', done.length >= 50],
  ['🎧', '1 hour listened', listened >= 3600], ['🎯', 'Perfect quiz', quizzed.some(d => d.score === d.total)], ['🔥', '7-day streak', longest >= 7],
  ['🖼️', 'First PPDT', (s.drills || []).some(d => d.kind === 'ppdt')], ['🎖️', 'SSB explorer', ssbSeen >= 11], ['🎒', 'Bag packed', Object.keys(s.pack || {}).length >= 15],
];
document.getElementById('badges').innerHTML = B.map(([e, n, g]) => `<div class="sticker${g ? ' got' : ''}"><div class="e">${e}</div>${n}</div>`).join('');

const COLORS = { defence: '#1F7A4D', civil: '#B5541B', banking: '#13568C', it: '#5B2BD9' };
const rows = loaded.map(({ e, x }) => { const ch = examChapters(x); return { e, n: ch.filter(c => s.completed[c.key]).length, t: ch.length }; })
  .filter(r => r.n).sort((a, b) => b.n / b.t - a.n / a.t);
document.getElementById('exams').innerHTML = rows.length ? `<div class="card" style="padding:6px 16px">${rows.map(r => `
  <a class="exam-p press" href="${r.e.id === 'ssb' ? 'ssb.html' : 'exam.html?id=' + r.e.id}" style="padding:12px 0;border-bottom:1px solid var(--line)">
    <b style="width:120px;font-size:14px">${esc(r.e.name)}</b><div class="bar2"><i style="width:${(r.n / r.t) * 100}%;background:${COLORS[r.e.c.id]}"></i></div>
    <span class="muted" style="font-size:12px;font-weight:700;width:44px;text-align:right">${r.n}/${r.t}</span></a>`).join('')}</div>`
  : '<a class="row press" href="exams.html"><div class="thumb" style="background:var(--g-me)">→</div><div class="body"><div class="t">No lessons yet</div><div class="s">Pick an exam and finish your first 3-minute lesson.</div></div></a>';

const icon = { complete: '✅', drill: '🎖️' };
const feed = (s.activity || []).filter(a => a.type !== 'ncert').slice(0, 40);
document.getElementById('feed').innerHTML = feed.length ? `<div class="card" style="padding:4px 16px">${feed.map(a => {
  const bits = [];
  if (a.listened) bits.push(`🎧 ${fmtMinutes(a.listened)}`);
  if (a.score != null && a.total) bits.push(`quiz ${a.score}/${a.total}`);
  return `<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)"><span style="font-size:20px">${icon[a.type] || '•'}</span>
    <div style="flex:1;min-width:0"><div style="font-size:14px"><b>${esc(a.exam || '')}</b> · ${esc(a.title)}</div>
    <div class="muted" style="font-size:12px;font-weight:600">${[...bits, timeAgo(a.at)].map(esc).join(' · ')}</div></div></div>`;
}).join('')}</div>` : '<p class="muted">Your activity shows up here.</p>';

document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(store.read(), null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `brodoit-prep-${new Date().toISOString().slice(0, 10)}.json` });
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('import').onchange = async e => {
  try { const d = JSON.parse(await e.target.files[0].text()); if (!d.completed) throw new Error('not a progress file'); store.write({ ...store.read(), ...d }); location.reload(); }
  catch (err) { alert('Could not import: ' + err.message); }
};
document.getElementById('reset').onclick = () => { if (confirm('Delete all progress on this device?')) { store.reset(); location.reload(); } };
</script>
</body>
</html>
