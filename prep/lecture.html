<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lesson — Brodoit Prep</title>
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  body{background:#0B0B0D;color:#fff;padding:0;overflow:hidden;height:100dvh}
  .player{height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .bars{display:flex;gap:4px;margin:4px 0 10px}
  .bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
  .bars i b{display:block;height:100%;width:0;background:#fff;transition:width .3s}
  .bars i.done b{width:100%}
  /* shared bar, tinted for the dark player (structure + sizes come from topbar.css) */
  .player .bd-top{position:static;padding-top:0;background:transparent;border-bottom:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .player .bd-top-in{padding:0;min-height:48px;max-width:none}
  .player .bd-home{background:#1F1F24;border-color:transparent;color:#fff}
  .player .bd-home:active{background:#2A2A30}
  .player .bd-back{color:#fff}
  .player .bd-back:active{background:#1F1F24}
  .player .bd-title{color:#fff}
  .player .bd-title small{color:#9A9AA3}
  .head .x{width:44px;height:44px;border-radius:50%;background:#1F1F24;color:#fff;display:grid;place-items:center;flex-shrink:0}
  .head .x svg{width:20px;height:20px}
  .deck{position:relative;flex:1;margin:12px 0 10px}
  .c{position:absolute;inset:0;border-radius:var(--r-lg);padding:24px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
     touch-action:pan-y;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s;will-change:transform;box-shadow:0 30px 60px rgba(0,0,0,.45);
     background:#FFFFFF;color:#0E0E10;user-select:none;-webkit-user-select:none}
  .c.hide{opacity:0;pointer-events:none;transform:translateY(40px) scale(.86)}
  .c.n1{transform:translateY(16px) scale(.94);opacity:.9;pointer-events:none;filter:brightness(.85)}
  .c.n2{transform:translateY(30px) scale(.88);opacity:.6;pointer-events:none;filter:brightness(.7)}
  .c.gone{transform:translateX(-130%) rotate(-14deg);opacity:0;pointer-events:none}
  .c.drag{transition:none}
  .c.n1 > *,.c.n2 > *,.c.hide > *{visibility:hidden}
  .c .type{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:rgba(14,14,16,.07)}
  .c h2{font-size:clamp(24px,6.5vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.12}
  .c .body{font-size:17px;line-height:1.6;font-weight:500}
  .c ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .c li{display:flex;gap:10px;font-size:16px;line-height:1.5;font-weight:500}
  .c li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;margin-top:8px}
  .c code{font-family:'JetBrains Mono',monospace;font-size:.9em;background:rgba(14,14,16,.08);padding:1px 6px;border-radius:6px}
  .c .body code{white-space:pre-wrap}
  .c.concept{background:#FFF6F0}
  .c.concept .type{background:#FFE6DA;color:#C2410C}
  .c.formula{background:#1E1B2E;color:#fff}
  .c.formula .type{background:rgba(255,255,255,.12);color:#C4B5FD}
  .c.formula li{font-family:'JetBrains Mono',monospace;font-size:15px;background:rgba(255,255,255,.07);padding:10px 12px;border-radius:12px}
  .c.formula li::before{display:none}
  .c.formula code{background:rgba(255,255,255,.12)}
  .c.example{background:#E4EFFF}
  .c.example .type{background:#C7DDFF;color:#1D4ED8}
  .c.tip{background:#FFF1C2}
  .c.tip .type{background:#FFE17A;color:#854D0E}
  .c.quiz{background:#F0FBF4}
  .c.quiz .type{background:#BBF7D0;color:#166534}
  .opt{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;text-align:left;padding:14px;border-radius:var(--r-md);background:#fff;border:2px solid rgba(14,14,16,.08);box-shadow:0 4px 0 0 rgba(14,14,16,.08);font-weight:600;font-size:15px;color:#0E0E10;transition:transform var(--m-press),box-shadow var(--m-press)}
  .opt:not([disabled]):active{transform:translateY(4px);box-shadow:none}
  .opt + .opt{margin-top:8px}
  .opt .l{width:30px;height:30px;border-radius:10px;background:#F0EEEA;display:grid;place-items:center;font-weight:800;flex-shrink:0}
  .opt.right{border-color:#16A34A;background:#ECFDF3}.opt.right .l{background:#16A34A;color:#fff}
  .opt.wrong{border-color:#E5484D;background:#FEF2F2}.opt.wrong .l{background:#E5484D;color:#fff}
  .explain{border-radius:var(--r-md);padding:12px 14px;background:rgba(14,14,16,.05);font-size:14px;font-weight:500}
  .c.end{background:linear-gradient(160deg,#FF5A1F,#FFC24B);color:#fff;align-items:center;justify-content:center;text-align:center}
  .c.end .big{font-size:72px;line-height:1}
  .c .hint{margin-top:auto;font-size:12px;font-weight:700;opacity:.45;text-align:center}
  .ctrl{display:flex;gap:10px;align-items:center}
  .ctrl button{height:54px;border-radius:999px;font-weight:800;font-size:15px}
  .ctrl .nav{width:54px;background:#1F1F24;color:#fff;display:grid;place-items:center;font-size:20px}
  .ctrl .listen{flex:1;background:#fff;color:#0E0E10;display:flex;align-items:center;justify-content:center;gap:8px}
  .ctrl .listen.on{background:#16A34A;color:#fff}
  .opts{display:flex;justify-content:center;gap:10px;margin-top:10px;font-size:12px;color:#9A9AA3;font-weight:600;align-items:center}
  .opts select{background:#1F1F24;color:#fff;border:none;border-radius:8px;padding:5px 8px;font:600 12px var(--font);max-width:150px}
  .reader{position:fixed;inset:0;z-index:150;background:var(--bg);color:var(--ink);overflow-y:auto;animation:rise .3s both}
  .reader .rh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .reader .rp{height:3px;background:var(--accent);width:0;position:sticky;top:0}
  .reader article{max-width:680px;margin:0 auto;padding:6px 20px 120px}
  .reader h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}
  .reader .sec{background:var(--card);border-radius:var(--r-lg);padding:18px 18px 8px;margin-top:14px;box-shadow:var(--shadow)}
  .reader h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;display:flex;gap:10px;align-items:center}
  .reader h2 span{width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0}
  .reader p{font-size:16px;line-height:1.7;color:var(--ink-2);margin-bottom:12px}
  .reader ul{margin:0 0 12px 0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .reader li{display:flex;gap:10px;font-size:15px;line-height:1.55;color:var(--ink-2)}
  .reader li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
  .reader code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--card-2);padding:1px 6px;border-radius:6px;white-space:pre-wrap}
  .reader strong{color:var(--ink)}
  .confetti{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:200;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="player">
  <div class="bars" id="bars"></div>
  <header class="bd-top head"><div class="bd-top-in">
    <a class="bd-home press" href="/?tab=learn" aria-label="Back to Brodoit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Brodoit</span></a>
    <a class="bd-back press" id="close" href="exams.html" aria-label="Close lesson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    <div class="bd-title"><span id="ttl"></span><small><span id="count"></span> · <span id="crumb"></span></small></div>
    <div class="bd-right"><button class="x press" id="notesBtn" hidden aria-label="Full notes" title="Full notes" data-ico="book-open" data-size="20"></button></div>
  </div></header>
  <div class="deck" id="deck"></div>
  <div class="ctrl">
    <button class="nav press" id="prev" aria-label="Previous" data-ico="arrow-left" data-size="22"></button>
    <button class="listen press" id="listen"><span data-ico="headphones" data-size="18"></span> Listen</button>
    <button class="nav press" id="next" aria-label="Next" data-ico="arrow-right" data-size="22"></button>
  </div>
  <div class="opts" id="audioOpts">Speed <select id="rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
    <span>Voice</span><select id="voice"></select></div>
</div>

<script type="module">
import { loadExam, loadExamWithCore, examChapters, store, addTime, logActivity, richText, esc, param, fmtMinutes } from './assets/js/app.js?v=9';
import { ic, hydrateIcons } from './assets/js/ico.js?v=14';
hydrateIcons();

const examId = param('exam'), subjId = param('s'), chapId = param('c'), fromId = param('from') || examId;
const exam = await loadExam(examId).catch(() => null);
if (!exam) { document.getElementById('deck').innerHTML = '<div class="c end"><h2>Lesson not found</h2><p><a class="btn btn-dark press" href="index.html">All exams</a></p></div>'; throw new Error('missing'); }
const subject = exam.subjects.find(s => s.id === subjId);
const chapter = subject?.chapters.find(c => c.id === chapId);
const deck = document.getElementById('deck');
if (!chapter) { deck.innerHTML = '<div class="c end"><h2>Lesson not found</h2></div>'; throw new Error('missing'); }

const key = `${examId}/${subjId}/${chapId}`;
const isSSB = fromId === 'ssb';
const { exam: parent, core } = isSSB ? { exam, core: null } : await loadExamWithCore(fromId);
const order = [...examChapters(parent), ...(core ? examChapters(core) : [])];
const nextCh = order[order.findIndex(x => x.key === key) + 1];
const backHref = isSSB ? 'ssb.html' : `exam.html?id=${fromId}`;
// ---------- full notes reader ----------
const notes = chapter.notes || [];
if (notes.length) {
  const btn = document.getElementById('notesBtn');
  btn.hidden = false;
  btn.onclick = openNotes;
}
const paras = t => String(t || '').split(/\n\n+/).map(x => `<p>${richText(x)}</p>`).join('');
function openNotes() {
  if (listening) stopListening();
  const words = notes.reduce((a, n) => a + (n.p || '').split(/\s+/).length + (n.points || []).join(' ').split(/\s+/).length, 0);
  const r = document.createElement('div');
  r.className = 'reader';
  r.innerHTML = `<div class="rh"><button class="x press icon-btn" aria-label="Close notes">${ic('x', 20)}</button>
      <div style="flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Full notes</div>
      <span class="pill" style="box-shadow:none;background:var(--card-2)">${Math.max(1, Math.round(words / 200))} min read</span></div>
    <div class="rp" id="rp"></div>
    <article><div class="eyebrow" style="color:var(--accent)">${esc(crumb)}</div><h1>${esc(chapter.title)}</h1>
      ${notes.map((n, i) => `<section class="sec"><h2><span>${i + 1}</span>${esc(n.h || '')}</h2>${paras(n.p)}${n.points && n.points.length ? `<ul>${n.points.map(pt => `<li><span>${richText(pt)}</span></li>`).join('')}</ul>` : ''}</section>`).join('')}
      <button class="btn btn-dark btn-block press" style="margin-top:18px" id="nDone">Done reading ✓</button></article>`;
  document.body.append(r);
  const close = () => { r.remove(); };
  r.querySelector('.x').onclick = close;
  r.querySelector('#nDone').onclick = () => { store.update(s => { s.notesRead = { ...(s.notesRead || {}), [key]: Date.now() }; }); close(); };
  r.addEventListener('scroll', () => { r.querySelector('#rp').style.width = `${(r.scrollTop / (r.scrollHeight - r.clientHeight)) * 100}%`; });
}
const lessonHref = x => `lecture.html?exam=${x.key.split('/')[0]}&s=${x.subject.id}&c=${x.chapter.id}&from=${fromId}`;
const crumb = `${parent.name} · ${subject.name}`;
document.getElementById('close').href = backHref;
document.getElementById('crumb').textContent = crumb;
document.getElementById('ttl').textContent = chapter.title;
document.title = `${chapter.title} — Brodoit Prep`;
store.update(s => { s.last = { href: location.pathname.split('/').pop() + location.search, title: chapter.title, exam: crumb, at: Date.now() }; });

// ---------- cards ----------
const LABEL = { concept: `${ic('lightbulb', 12)} Concept`, formula: `${ic('hash', 12)} Formulas`, example: `${ic('pencil', 12)} Example`, tip: `${ic('target', 12)} Exam tip`, quiz: `${ic('check-circle', 12)} Quick check` };
const cards = chapter.cards;
const quiz = {};
deck.innerHTML = cards.map((c, i) => c.type === 'quiz'
  ? `<article class="c quiz" data-i="${i}"><span class="type">${LABEL.quiz}</span><h2>${richText(c.q)}</h2>
      <div>${c.options.map((o, j) => `<button class="opt" data-j="${j}"><span class="l">${'ABCD'[j]}</span><span>${richText(o)}</span></button>`).join('')}</div>
      <div class="explain" hidden>${richText(c.explain || '')}</div></article>`
  : `<article class="c ${c.type}" data-i="${i}"><span class="type">${LABEL[c.type] || c.type}</span>
      ${c.title ? `<h2>${richText(c.title)}</h2>` : ''}${c.body ? `<div class="body">${richText(c.body)}</div>` : ''}
      ${c.points ? `<ul>${c.points.map(p => `<li><span>${richText(p)}</span></li>`).join('')}</ul>` : ''}
      ${i === 0 ? '<div class="hint">Swipe left for next →</div>' : ''}</article>`).join('')
  + `<article class="c end" data-i="${cards.length}" id="endCard"></article>`;
const els = [...deck.children];
const total = els.length;
document.getElementById('bars').innerHTML = cards.map(() => '<i><b></b></i>').join('');
const bars = [...document.getElementById('bars').children];

let idx = 0;
function layout() {
  els.forEach((el, j) => {
    el.classList.remove('gone', 'n1', 'n2', 'hide');
    el.style.transform = '';
    el.style.zIndex = total - j;
    if (j < idx) el.classList.add('gone');
    else if (j === idx + 1) el.classList.add('n1');
    else if (j === idx + 2) el.classList.add('n2');
    else if (j > idx + 2) el.classList.add('hide');
  });
  bars.forEach((b, j) => b.classList.toggle('done', j <= idx));
  document.getElementById('count').textContent = `${Math.min(idx + 1, cards.length)}/${cards.length}`;
  if (idx === total - 1) complete();
}
function go(i) {
  i = Math.max(0, Math.min(total - 1, i));
  if (i === idx) return;
  idx = i; layout();
  if (listening && idx !== spoken && idx < cards.length) speakCard(idx);
  if (idx >= cards.length && listening) stopListening();
}
layout();
document.getElementById('prev').onclick = () => go(idx - 1);
document.getElementById('next').onclick = () => idx === total - 1 ? (location.href = nextCh ? lessonHref(nextCh) : backHref) : go(idx + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });

// drag to swipe (horizontal only; vertical stays native scroll)
let sx = 0, sy = 0, dx = 0, dragging = false, axis = null, el = null;
deck.addEventListener('pointerdown', e => {
  el = e.target.closest('.c'); if (!el || +el.dataset.i !== idx || e.target.closest('button')) { el = null; return; }
  sx = e.clientX; sy = e.clientY; dx = 0; axis = null; dragging = true;
});
deck.addEventListener('pointermove', e => {
  if (!dragging || !el) return;
  const mx = e.clientX - sx, my = e.clientY - sy;
  if (!axis && Math.hypot(mx, my) > 8) axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
  if (axis !== 'x') return;
  dx = mx; el.classList.add('drag');
  el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
});
const end = () => {
  if (!dragging || !el) return;
  dragging = false; el.classList.remove('drag');
  if (axis === 'x' && dx < -70) go(idx + 1);
  else if (axis === 'x' && dx > 70) go(idx - 1);
  else el.style.transform = '';
  el = null;
};
deck.addEventListener('pointerup', end); deck.addEventListener('pointercancel', end);

deck.addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const card = b.closest('.c'), i = +card.dataset.i, c = cards[i];
  if (i in quiz) return;
  quiz[i] = +b.dataset.j === c.answer;
  card.querySelectorAll('.opt').forEach((o, j) => { o.disabled = true; if (j === c.answer) o.classList.add('right'); });
  if (!quiz[i]) b.classList.add('wrong');
  card.querySelector('.explain').hidden = false;
  navigator.vibrate?.(quiz[i] ? 15 : [30, 40, 30]);
});

// ---------- time tracking ----------
let readSec = 0, listenSec = 0, sessionListen = 0;
setInterval(() => {
  if (document.hidden) return;
  if (listening && speechSynthesis.speaking) { listenSec++; sessionListen++; } else readSec++;
  if (readSec + listenSec >= 15) flush();
}, 1000);
function flush() { addTime('study', key, readSec); addTime('listen', key, listenSec); readSec = 0; listenSec = 0; }
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => document.hidden && flush());

// ---------- completion ----------
let completed = false;
function complete() {
  const qi = cards.map((c, i) => c.type === 'quiz' ? i : -1).filter(i => i >= 0);
  const score = qi.filter(i => quiz[i]).length, tot = qi.length, answered = qi.filter(i => i in quiz).length;
  if (!completed) {
    completed = true; flush();
    store.update(s => { const p = s.completed[key]; s.completed[key] = { at: Date.now(), score: p && p.score > score ? p.score : score, total: tot }; });
    logActivity({ type: 'complete', key, exam: parent.name, title: `${subject.name} › ${chapter.title}`, listened: sessionListen, score: answered ? score : null, total: tot, href: lessonHref({ key, subject, chapter }) });
    confetti();
  }
  document.getElementById('endCard').innerHTML = `
    <div class="big">🏆</div><h2 style="font-size:32px">Lesson done!</h2>
    <div style="font-weight:700;opacity:.92">${esc(chapter.title)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      ${tot ? `<span class="pill" style="background:rgba(255,255,255,.22);color:#fff;box-shadow:none">Quiz ${score}/${tot}</span>` : ''}
      ${sessionListen ? `<span class="pill" style="background:rgba(255,255,255,.22);color:#fff;box-shadow:none">${ic('headphones', 14)} ${fmtMinutes(sessionListen)}</span>` : ''}
    </div>
    ${notes.length ? `<button class="btn press" style="background:#0E0E10;color:#fff;margin-top:8px" onclick="document.getElementById('notesBtn').click()">${ic('book-open', 18)} Read the full notes</button>` : ''}
    ${nextCh ? `<a class="btn press" style="background:#fff;color:#0E0E10" href="${lessonHref(nextCh)}">Next: ${esc(nextCh.chapter.title)} →</a>` : ''}
    <a class="btn press" style="background:rgba(14,14,16,.25);color:#fff" href="${backHref}">Back to lessons</a>`;
}
function confetti() {
  const colors = ['#FF5A1F', '#FFC24B', '#5B2BD9', '#16A34A', '#0EA5E9', '#fff'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    p.style.animationDelay = Math.random() * .4 + 's';
    document.body.append(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ---------- audiobook mode ----------
const listenBtn = document.getElementById('listen'), rateSel = document.getElementById('rate'), voiceSel = document.getElementById('voice');
let listening = false, voices = [], spoken = -1;
if (!('speechSynthesis' in window)) { listenBtn.hidden = true; document.getElementById('audioOpts').hidden = true; }
else {
  const load = () => {
    voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en') || v.lang.startsWith('hi'));
    voiceSel.hidden = voiceSel.previousElementSibling.hidden = !voices.length;
    const pref = voices.findIndex(v => v.lang === 'en-IN');
    voiceSel.innerHTML = voices.map((v, i) => `<option value="${i}"${i === pref ? ' selected' : ''}>${esc(v.name)}</option>`).join('');
  };
  load(); speechSynthesis.onvoiceschanged = load;
  try { rateSel.value = localStorage.getItem('academy.rate') || '1'; } catch {}
  rateSel.onchange = () => { try { localStorage.setItem('academy.rate', rateSel.value); } catch {} };
}
const plain = s => String(s || '').replace(/\*\*|`/g, '');
function speechFor(i) {
  const c = cards[i];
  if (c.type === 'quiz') return `Quick check. ${plain(c.q)} ${c.options.map((o, j) => `Option ${'ABCD'[j]}: ${plain(o)}.`).join(' ')} The answer is option ${'ABCD'[c.answer]}. ${plain(c.explain)}`;
  return [c.title, c.body, ...(c.points || [])].map(plain).filter(Boolean).join('. ');
}
function speakCard(i) {
  spoken = i; speechSynthesis.cancel();
  const parts = speechFor(i).match(/[^.!?]+[.!?]*/g) || [];
  parts.forEach((p, n) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.rate = +rateSel.value;
    if (voices[voiceSel.value]) u.voice = voices[voiceSel.value];
    if (n === parts.length - 1) u.onend = () => {
      if (!listening || spoken !== i) return;
      if (i + 1 < cards.length) { spoken = i + 1; go(i + 1); setTimeout(() => listening && spoken === i + 1 && speakCard(i + 1), 500); }
      else { go(cards.length); stopListening(); }
    };
    speechSynthesis.speak(u);
  });
}
function stopListening() { listening = false; speechSynthesis.cancel(); listenBtn.classList.remove('on'); listenBtn.innerHTML = `${ic('headphones', 18)} Listen`; }
listenBtn.onclick = () => {
  if (listening) return stopListening();
  listening = true; listenBtn.classList.add('on'); listenBtn.innerHTML = `${ic('pause', 18)} Pause`;
  speakCard(Math.min(idx, cards.length - 1));
};
addEventListener('pagehide', () => window.speechSynthesis?.cancel());
</script>
</body>
