<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Groups — Brodoit Prep</title>
<meta name="theme-color" content="#F6F5F2">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=14">
<link rel="stylesheet" href="assets/app.css?v=14">
<link rel="stylesheet" href="/lang/assets/topbar.css?v=14">
<script src="/app/icons.js?v=14" defer></script>
<script src="/lang/assets/topbar.js?v=14" defer></script>
<style>
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:4px 6px 4px 16px;box-shadow:var(--shadow);margin:12px 0 10px}
  .search input{flex:1;border:none;background:none;font:600 15px var(--font);color:var(--ink);padding:10px 0;outline:none;min-width:0;min-height:44px}
  .g{display:flex;gap:14px;align-items:center;padding:14px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:10px}
  .g .av{width:54px;height:54px;border-radius:var(--r-md);display:grid;place-items:center;color:#fff;flex-shrink:0;font-weight:800}
  .g .b{flex:1;min-width:0}
  .g .n{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g .d{font-size:12px;color:var(--mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .g .act{min-height:44px;padding:0 14px;font-size:13px;flex-shrink:0}
  .badge-dot{background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;margin-left:6px}
  .fab{position:fixed;right:18px;bottom:calc(var(--tabbar) + 26px + env(safe-area-inset-bottom));z-index:45;background:var(--accent);color:#fff;border-radius:999px;padding:15px 20px;font-weight:800;box-shadow:0 14px 30px rgba(255,90,31,.4);display:flex;gap:8px;align-items:center}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:95}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:96;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:rise var(--m-enter) var(--ease) both}
  .sheet label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
  .sheet input,.sheet textarea{width:100%;min-height:44px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card-2);color:var(--ink);font:500 15px var(--font)}
  .sheet textarea{min-height:80px;resize:vertical}
  .empty{text-align:center;padding:30px 10px;color:var(--mute)}
  .empty .e{font-size:48px}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="h-xl rise" style="margin:6px 0 4px">Study<br>together.</h1>
  <p class="muted" style="font-weight:600">Find a group for your exam or start one. You approve who joins your group.</p>
  <div class="seg" id="seg" style="margin-top:14px"><button class="on" data-v="discover">Discover</button><button data-v="mine">My groups</button></div>
  <div id="body"></div>
</main>
<button class="fab press" id="create" hidden><span data-ico="plus" data-size="18"></span> New group</button>

<script type="module">
import { renderChrome, api, token, signInCard, esc, toast, timeAgo } from './assets/js/app.js?v=9';
import { ic, hydrateIcons } from './assets/js/ico.js?v=14';
renderChrome({ active: 'groups.html', title: 'Groups' });
hydrateIcons();

const COLORS = { NDA: '#1F7A4D', CDS: '#1F5A7A', AFCAT: '#2563EB', SSB: '#2B4C8C', UPSC: '#B5541B', Banking: '#13568C', 'IT jobs': '#5B2BD9', GATE: '#7C3AED', General: '#FF5A1F' };
const ICO = { NDA: 'medal', CDS: 'shield', AFCAT: 'plane', SSB: 'star', UPSC: 'landmark', Banking: 'building-2', 'IT jobs': 'laptop', GATE: 'graduation-cap', General: 'message-circle' };
const topicIcon = (t, size) => (ICO[t] ? ic(ICO[t], size) : '');
const body = document.getElementById('body');
let view = 'discover', topic = '', q = '', topics = [];

if (!token()) { body.innerHTML = signInCard(); document.getElementById('seg').hidden = true; }
else init();

async function init() {
  try { topics = (await api('/topics')).topics; }
  catch (e) { if (e.status === 401) { body.innerHTML = signInCard(); return; } }
  document.getElementById('create').hidden = false;
  draw();
}

document.getElementById('seg').onclick = e => {
  if (!e.target.dataset.v) return;
  view = e.target.dataset.v;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === e.target));
  draw();
};

async function draw() {
  body.innerHTML = `${view === 'discover' ? `
    <div class="search"><span class="muted">${ic('search', 18)}</span><input id="q" placeholder="Search groups" value="${esc(q)}"></div>
    <div class="chips"><button class="chip${!topic ? ' on' : ''}" data-t="">All</button>${topics.map(t => `<button class="chip${t === topic ? ' on' : ''}" data-t="${esc(t)}">${topicIcon(t, 14)} ${esc(t)}</button>`).join('')}</div>` : ''}
    <div id="list"><div class="empty">Loading…</div></div>`;
  const qi = document.getElementById('q');
  if (qi) { let tmr; qi.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => { q = qi.value; list(); }, 300); }; }
  body.querySelector('.chips')?.addEventListener('click', e => { if (e.target.dataset.t !== undefined) { topic = e.target.dataset.t; draw(); } });
  list();
}

async function list() {
  const el = document.getElementById('list');
  try {
    const { groups } = await api(`/groups?topic=${encodeURIComponent(topic)}&q=${encodeURIComponent(q)}`);
    const shown = view === 'mine' ? groups.filter(g => g.my) : groups;
    el.innerHTML = shown.length ? shown.map(card).join('') : `<div class="empty"><div class="e">${view === 'mine' ? '🫂' : '🔭'}</div>
      <p style="font-weight:700;margin-top:6px">${view === 'mine' ? 'You haven\'t joined a group yet.' : 'No groups here yet.'}</p><p style="font-size:14px">Be the first — tap “New group”.</p></div>`;
  } catch (e) { el.innerHTML = e.status === 401 ? signInCard() : `<div class="empty">${esc(e.message)}</div>`; }
}

function card(g) {
  const c = COLORS[g.topic] || '#FF5A1F';
  const st = g.my?.status;
  const btn = st === 'approved' ? `<a class="btn btn-dark act press" href="group.html?id=${g.id}">Open</a>`
    : st === 'pending' ? `<span class="btn btn-ghost act" style="color:var(--mute)">Requested</span>`
    : `<button class="btn btn-accent act press" data-join="${g.id}">Join</button>`;
  return `<div class="g">
    <a class="av" href="group.html?id=${g.id}" style="background:${c}">${ic(ICO[g.topic] || 'message-circle', 24)}</a>
    <a class="b" href="group.html?id=${g.id}"><div class="n">${esc(g.name)}${g.pending ? `<span class="badge-dot">${g.pending}</span>` : ''}</div>
      <div class="d">${esc(g.topic)} · ${g.members} member${g.members === 1 ? '' : 's'}${g.lastAt ? ' · active ' + timeAgo(Date.parse(g.lastAt.replace(' ', 'T') + 'Z')) : ''}${g.description ? ' · ' + esc(g.description) : ''}</div></a>
    ${btn}</div>`;
}

body.addEventListener('click', async e => {
  const id = e.target.dataset.join;
  if (!id) return;
  e.target.disabled = true;
  try { await api(`/groups/${id}/join`, { method: 'POST' }); toast('Request sent — the group approver will let you in'); list(); }
  catch (err) { toast(err.message); e.target.disabled = false; }
});

document.getElementById('create').onclick = () => {
  const bg = Object.assign(document.createElement('div'), { className: 'sheet-bg' });
  const sh = Object.assign(document.createElement('form'), { className: 'sheet' });
  sh.innerHTML = `<div class="h-lg">Start a study group</div>
    <p class="muted" style="font-size:14px;margin-top:4px">You'll be the approver — you decide who joins, and you can make others approvers too.</p>
    <label>Group name</label><input name="name" required minlength="3" maxlength="60" placeholder="e.g. NDA 2027 Maths warriors">
    <label>Topic</label><div class="chips" id="tp">${topics.map((t, i) => `<button type="button" class="chip${i === 0 ? ' on' : ''}" data-t="${esc(t)}">${topicIcon(t, 14)} ${esc(t)}</button>`).join('')}</div>
    <label>What's it for? (optional)</label><textarea name="description" maxlength="300" placeholder="Daily PYQ practice, doubts, SSB tips…"></textarea>
    <div style="display:flex;gap:8px;margin-top:18px"><button type="button" class="btn btn-ghost press" style="flex:1" id="cx">Cancel</button><button class="btn btn-accent press" style="flex:2">Create group</button></div>`;
  let pick = topics[0];
  sh.querySelector('#tp').onclick = e => { if (e.target.dataset.t) { pick = e.target.dataset.t; sh.querySelectorAll('#tp .chip').forEach(c => c.classList.toggle('on', c === e.target)); } };
  const close = () => { bg.remove(); sh.remove(); };
  bg.onclick = close; sh.querySelector('#cx').onclick = close;
  sh.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(sh);
    try {
      const { group } = await api('/groups', { method: 'POST', body: { name: f.get('name'), description: f.get('description'), topic: pick } });
      location.href = `group.html?id=${group.id}`;
    } catch (err) { toast(err.message); }
  };
  document.body.append(bg, sh);
  sh.querySelector('input').focus();
};
</script>
</body>
</html>
