<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Competitive Exam Prep &mdash; Brodoit</title>
<meta name="description" content="Swipe lectures, audio lessons and previous papers for NDA, CDS, AFCAT, SSB, UPSC CSE, SBI, IBPS, RBI, NABARD, GATE and IT placement tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/learn.css">
</head>
<body>
<main class="page">
  <div class="page-head">
    <h1>Competitive Exam Prep</h1>
    <p>Choose your exam. Each one has swipe lectures you can read or listen to, quick quizzes, the exam pattern, 10 years of previous papers and free official resources.</p>
  </div>
  <div class="chips" id="jump"></div>
  <div id="cats"></div>
</main>

<script type="module">
import { renderNav, renderFooter, loadCatalog, store, esc } from './assets/js/app.js';
renderNav('exams.html');
renderFooter();

const cat = await loadCatalog();
const s = store.read();
const doneIn = id => Object.keys(s.completed).filter(k => k.startsWith(id + '/')).length;

document.getElementById('jump').innerHTML = cat.categories.map(c =>
  `<a class="chip" href="#${c.id}">${c.icon} ${esc(c.name)}</a>`).join('');

document.getElementById('cats').innerHTML = cat.categories.map(c => `
  <section id="${c.id}">
    <h2 class="section-title">${c.icon} ${esc(c.name)}</h2>
    <p class="section-sub">${esc(c.blurb)}</p>
    <div class="grid">${c.exams.map(e => {
      const n = doneIn(e.id);
      return `<a class="tile" href="exam.html?id=${e.id}">
        <div class="kicker">${esc(e.by)}</div>
        <h3>${esc(e.name)}</h3>
        <p>${esc(e.short)}</p>
        <div class="meta">${n ? `<span class="pill ok">${n} chapter${n > 1 ? 's' : ''} done</span>` : 'Not started'}</div>
      </a>`;
    }).join('')}</div>
    ${c.id === 'it' ? companyList() : ''}
  </section>`).join('');

function companyList() {
  return `<div class="tile" style="margin-top:1rem" id="mylist">
    <div class="kicker">Your list</div>
    <h3>My target companies</h3>
    <p>Add the companies you're applying to — with the role and test date — and tick them off as you clear each one.</p>
    <form class="form-row" id="addCo">
      <input name="name" placeholder="Company (e.g. Zoho)" required maxlength="60">
      <input name="role" placeholder="Role / drive" maxlength="60">
      <input name="date" type="date">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
    <div id="coList"></div>
  </div>`;
}

function drawCompanies() {
  const list = store.read().companies;
  const el = document.getElementById('coList');
  if (!list.length) { el.innerHTML = '<p class="meta">Nothing added yet.</p>'; return; }
  el.innerHTML = list.map((c, i) => `
    <div class="check-row${c.done ? ' done' : ''}">
      <input type="checkbox" data-i="${i}" ${c.done ? 'checked' : ''} aria-label="Mark ${esc(c.name)} done">
      <div class="t"><b>${esc(c.name)}</b>${c.role ? ` · ${esc(c.role)}` : ''}${c.date ? ` <span class="meta">· test on ${esc(c.date)}</span>` : ''}</div>
      <button class="linkbtn" data-del="${i}" aria-label="Remove">✕</button>
    </div>`).join('');
}

document.getElementById('addCo').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  store.update(st => st.companies.push({ name: f.get('name').trim(), role: f.get('role').trim(), date: f.get('date'), done: false }));
  e.target.reset();
  drawCompanies();
});
document.getElementById('coList').addEventListener('click', e => {
  const del = e.target.dataset.del, tog = e.target.dataset.i;
  if (del !== undefined) store.update(st => st.companies.splice(+del, 1));
  else if (tog !== undefined) store.update(st => { st.companies[+tog].done = e.target.checked; });
  else return;
  drawCompanies();
});
drawCompanies();
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
