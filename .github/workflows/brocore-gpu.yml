# Builds Bro Core's GPU voice worker (brocore/gpu) into ghcr.io/<owner>/brocore-gpu.
# The app server deploys it to RunPod by itself once a RunPod key is pasted in Admin (modules/brocore/gpu.js).
name: Bro Core GPU voice image
on:
  push:
    branches: [main]
    paths: ['brocore/gpu/**', '.github/workflows/brocore-gpu.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    # the image lives under the brodoit repo's package (both repos mirror each other; only one may own it)
    if: github.repository == 'rishabh071106-eng/brodoit'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase owner)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/brocore-gpu" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: brocore/gpu
          push: true
          tags: ${{ steps.img.outputs.name }}:latest,${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
