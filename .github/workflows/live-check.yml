# Checks brodoit.com every 30 minutes and after each deploy. A failed scheduled run emails the repo owner
# (GitHub's default), so an outage is noticed within half an hour. Public pages only: no keys, no logins.
name: Live check
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  live:
    # the mirror repo (brodoit) is not what Railway deploys, so only its scheduled and manual runs check the site
    if: github.event_name != 'push' || github.repository == 'rishabh071106-eng/taskflow'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: brodoit.com answers on every app
        run: |
          # after a push, wait until brodoit.com runs this very commit (Railway reports it in /api/health), so the
          # checks below test the new deploy, not the old one still serving while the new one builds
          want=""; [ "$GITHUB_EVENT_NAME" = push ] && want="${GITHUB_SHA:0:12}"
          ok=0; live=""
          for i in $(seq 1 40); do # a deploy that is still building or rolling out gets up to 20 minutes
            h=$(curl -fsS --max-time 20 https://brodoit.com/api/health || echo '{}')
            if echo "$h" | grep -q '"status":"ok"'; then
              ok=1; live=$(echo "$h" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
              if [ -z "$want" ] || [ "$live" = "$want" ]; then break; fi
              echo "brodoit.com still runs ${live:-an older build}; waiting for $want ($i)"
            else ok=0; echo "health not ready ($i)"; fi
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::brodoit.com/api/health is down"; exit 1; }
          if [ -n "$want" ] && [ "$live" != "$want" ]; then
            if [ -z "$live" ]; then echo "::warning::/api/health reports no commit; testing whatever is live"
            else echo "::error::brodoit.com still runs $live, not $want, after 20 minutes (deploy stuck?)"; exit 1; fi
          fi
          fail=0
          for p in / /app/ui.css /app/voice.js /mind/ '/mind/game.html?g=memory' /code/ '/lang/course.html?c=es' /sw.js; do
            if curl -fsS --max-time 20 -o /dev/null -w "%{http_code} $p\n" "https://brodoit.com$p"; then :; else echo "::error::$p failed"; fail=1; fi
          done
          [ "$fail" = 0 ] || exit 1
      - name: Bro is ready (brain answers, voice speaks, hearing hears)
        run: |
          # /api/bro/ok is one bit: Bro Core's brain is configured and his voice engine is loaded.
          # After a deploy the voice model may still be loading, so this waits up to 15 minutes.
          for i in $(seq 1 30); do
            st=$(curl -fsS --max-time 20 https://brodoit.com/api/bro/ok || echo '{}')
            # ready = brain configured + voice loaded + the self-test passed (a real brain answer, Bro's voice heard back, and a
            # live-style turn with the real tool definitions answered "When does Navratri end this year?", and a real call
            # turn through the phone's own path answered "What is the capital of India?" out loud)
            if echo "$st" | grep -q '"ok":true' && echo "$st" | grep -q '"check":{"brain":"ok","hearing":"ok","tools":"ok","talk":"ok"}'; then echo "Bro is ready $st"; exit 0; fi
            if echo "$st" | jq -e '(.check // {}) | to_entries | any(.value == "fail")' > /dev/null 2>&1; then echo "::error::Bro's self-test failed: $st"; exit 1; fi
            echo "Bro not ready yet ($i): $st"; sleep 30
          done
          echo "::error::Bro Core is not ready (brain or voice down)"; exit 1
      - name: Bro's own brain (his own model on our server; reported here, never blocks a release)
        run: |
          # after a deploy the model may still be downloading (once) and loading: wait up to 20 minutes for its own self-check
          own='{}'; chk=none
          for i in $(seq 1 40); do
            st=$(curl -fsS --max-time 20 https://brodoit.com/api/bro/ok || echo '{}')
            own=$(echo "$st" | jq -c '.own // {}' 2>/dev/null || echo '{}')
            state=$(echo "$own" | jq -r '.state // "none"'); chk=$(echo "$own" | jq -r '.check // "none"')
            case "$state" in idle|downloading|loading) echo "own brain $state ($i): $own"; sleep 30; continue;; esac
            if [ "$state" = ready ] && [ "$chk" != ok ] && [ "$chk" != fail ]; then echo "own brain ready, self-check running ($i): $own"; sleep 30; continue; fi
            break
          done
          if [ "$chk" = ok ]; then echo "::notice::Bro's own brain answers by itself: $own"; else echo "::warning::Bro's own brain is not answering by itself yet (the cloud brain answers): $own"; fi
      - name: Bro's cloud brains (which clouds answer, and how fast; reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 20 https://brodoit.com/api/bro/ok || echo '{}')
          clouds=$(echo "$st" | jq -c '.clouds // {}' 2>/dev/null || echo '{}')
          speed=$(echo "$st" | jq -c '.live // {} | {cloud, own, ownBackup, cloudSlow, firstMs, chatFirstMs}' 2>/dev/null || echo '{}')
          if [ "$(echo "$clouds" | jq -r '.gemini // false')" != false ]; then echo "::notice::Bro's cloud brains: $clouds · calls and chat: $speed"; else echo "::warning::Only Groq answers (no Gemini key, or it was refused): $clouds · $speed"; fi
      - name: The Android app and Google Play (reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 20 https://brodoit.com/api/android/status || echo '{}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://brodoit.com/android)
          if [ "$(echo "$st" | jq -r '.ready')" = true ] && [ "$code" = 200 ]; then echo "::notice::Testers download Brodoit $(echo "$st" | jq -r .version) at https://brodoit.com/android · Google Play: $(echo "$st" | jq -c '.play // {}')"
          else echo "::warning::The Android app is not ready for testers yet (/android $code): $(echo "$st" | jq -c '{ready, version, note, play}')"; fi
          # the Play uploader's certificate (public; its key stays on the server): what the Google Cloud service account trusts
          cert=$(curl -fsS --max-time 20 https://brodoit.com/download/play-api-cert.pem || true)
          if echo "$cert" | grep -q 'BEGIN CERTIFICATE'; then echo "Play uploader certificate:"; echo "$cert"; fi
