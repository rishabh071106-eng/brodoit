<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}else{document.documentElement.setAttribute("data-theme","light")}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Languages · Brodoit</title>
<meta name="description" content="Learn Spanish, French, German, Hindi or English by ear: audio lessons plus short practice.">
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=21">
<link rel="stylesheet" href="/lang/assets/lang.css?v=17">
<link rel="stylesheet" href="/lang/assets/topbar.css?v=16">
<link rel="stylesheet" href="/lang/assets/stages.css?v=4">
<link rel="stylesheet" href="/app/ui.css?v=22">
<script src="/app/icons.js?v=16" defer></script>
<script src="/lang/assets/topbar.js?v=17" defer></script>
</head>
<body class="lc-page">
<main class="wrap lc">
  <header class="ui-page-h lc-head"><div class="lc-ht"><h1 id="lcTitle">Languages</h1></div></header>
  <div class="ui-list" id="courses"></div>
</main>
<script type="module">
// /lang/ (rarely reached now: Learn → Languages is the way in): the same five rows as that list in the app
// (app/learn.js languagesHub) — letter tile, name, "Español · 12%", chevron.
import { renderChrome, store, esc, setCourse } from '/lang/assets/lang.js?v=14';

renderChrome({ title: 'Languages', back: '/?tab=learn', backLabel: 'Learn' });
window.bdTitleOnScroll && window.bdTitleOnScroll(document.getElementById('lcTitle'));

const LANGS = [
  { c: 'es', n: 'Spanish', native: 'Español', g: 'Ñ', a: '#DC2626' },
  { c: 'fr', n: 'French', native: 'Français', g: 'Ç', a: '#2563EB' },
  { c: 'de', n: 'German', native: 'Deutsch', g: 'ß', a: '#64748B' },
  { c: 'en', n: 'English', native: 'Taught in Hindi', g: 'Aa', a: '#7C3AED' },
  { c: 'hi', n: 'Hindi', native: 'हिन्दी', g: 'अ', a: '#EA580C' },
];
const TOTAL = 52; // 12 audio lessons + 40 practice lessons per language (as in app/learn.js)
const done = store.read().done || {};
const pct = c => { let n = 0; for (const k in done) if (done[k] && k.split('/')[0] === c) n++; return Math.min(100, Math.round(n / TOTAL * 100)); };
const chev = window.ico ? window.ico('chevron-right', 18) : '›';
const list = document.getElementById('courses');
list.innerHTML = LANGS.map(l => {
  const p = pct(l.c);
  return `<a class="ui-row" href="/lang/course.html?c=${l.c}" data-code="${l.c}">
    <span class="ui-ic" style="--ui-accent:${l.a}" aria-hidden="true"><b class="lc-glyph">${l.g}</b></span>
    <span class="ui-tx"><b>${esc(l.n)}</b><small>${esc(l.native)} · ${p ? p + '%' : 'Not started'}</small>${p ? `<span class="ui-prog" aria-hidden="true"><i style="width:${p}%;--ui-accent:${l.a}"></i></span>` : ''}</span>
    <span class="ui-chev" aria-hidden="true">${chev}</span></a>`;
}).join('');
list.addEventListener('click', e => { const a = e.target.closest('[data-code]'); if (a) setCourse(a.dataset.code); });
</script>
</body>
</html>
