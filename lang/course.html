<!DOCTYPE html>
<html lang="en">
<head>
<script src="/app/inframe.js?v=1"></script>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}else{document.documentElement.setAttribute("data-theme","light")}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Course · Brodoit Languages</title>
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=21">
<link rel="stylesheet" href="/lang/assets/lang.css?v=18">
<link rel="stylesheet" href="/lang/assets/topbar.css?v=16">
<link rel="stylesheet" href="/lang/assets/stages.css?v=4">
<link rel="stylesheet" href="/app/ui.css?v=23">
<script src="/app/icons.js?v=16" defer></script>
<script src="/lang/assets/topbar.js?v=17" defer></script>
</head>
<body class="lc-page">
<main class="wrap lc" id="main">
  <div id="head"></div>
  <div id="body" role="tabpanel"></div>
</main>
<script type="module">
// A language course (v15 framework, /DESIGN.md): the bar holds only the back chevron; the page opens with the
// course's own header (letter tile, large title, one status line), a Listen / Practice switch, and one list of
// lessons. Every lesson is the same framework row; the next lesson is the only one with a play mark.
import { renderChrome, loadCourses, loadCourse, loadAudioCourse, store, esc, t, param, courseProgress, setCourse, toast, comingSoonHTML, pullProgress } from '/lang/assets/lang.js?v=15';
import { mountStats } from '/lang/assets/fun.js?v=1';
import { ic } from '/lang/assets/ico.js?v=14';

// The School of Languages: Spanish, French, German and Hindi (taught in English), English (taught in Hindi).
const SCHOOL = ['es', 'fr', 'de', 'hi', 'en'];
const HUB = '/?tab=learn&hub=languages';
const code = param('c') || 'es';
if (!SCHOOL.includes(code)) (window.bdGo ? window.bdGo(HUB, { replace: true }) : location.replace(HUB));
const courses = await loadCourses();
const meta = courses.find(c => c.code === code) || { code, name: code.toUpperCase(), native: '', from: 'en', hasAudio: true };
const lang = meta.from;
const H = lang === 'hi';
const L = (en, hi) => H ? hi : en;
document.title = `${meta.name} · Brodoit Languages`;
if (H) document.documentElement.lang = 'hi';
const [course, audio] = await Promise.all([loadCourse(code), meta.hasAudio === false ? null : loadAudioCourse(code)]);
setCourse(code);
let s = store.read();
renderChrome({ title: meta.name, back: HUB, backLabel: L('Languages', 'भाषाओं पर वापस') });

// the same letter tile and accent as the Languages list in Learn (app/learn.js)
const GLY = { es: ['Ñ', '#DC2626'], fr: ['Ç', '#2563EB'], de: ['ß', '#64748B'], en: ['Aa', '#7C3AED'], hi: ['अ', '#EA580C'] };
const [glyph, accent] = GLY[code] || [meta.name.slice(0, 1), 'var(--g-lang)'];
const head = document.getElementById('head'), body = document.getElementById('body');
document.getElementById('main').style.setProperty('--lc-accent', accent);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// lesson titles are content; the page's copy rules still apply to how they are shown (no "Lesson 3 —", no "!")
const clean = x => String(x || '').replace(/^(Lesson|पाठ)\s*\d+\s*[—–-]\s*/i, '').replace(/\s*!+/g, '').trim();
const isDone = id => !!s.done[`${code}/${id}`];
const CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12.2-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z"/></svg>';
const CHEV = ic('chevron-right', 18);

// One row: number tile (done → check, next → number on the accent, locked → muted number), title, one status line,
// and at the right the play mark (next lesson only), a chevron (other open lessons) or nothing (locked).
// v21: the lessons are a path (DESIGN.md · Celebration): a round button per lesson (done → check, the next one →
// highlighted with "Start", locked → a lock), its title and status beside it, gently zig-zagging down the page.
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ZIG = [0, 18, 24, 18, 0, -18, -24, -18];
let nodeI = 0;
function row({ n, title, sub, href, state }) {
  const x = ZIG[nodeI++ % ZIG.length];
  const face = state === 'done' ? CHECK : state === 'locked' ? LOCK : n;
  const lbl = `<span class="lbl"><b>${esc(title)}</b><small>${esc(sub)}</small></span>`;
  const start = state === 'cur' ? `<span class="start" aria-hidden="true">${esc(t(lang, 'start'))}</span>` : '';
  if (state === 'locked') return `<div class="node locked" style="--x:${x}px"><button type="button" class="btn lc-row locked" aria-disabled="true" data-locked aria-label="${esc(title)} · ${esc(sub)}">${face}</button>${lbl}</div>`;
  return `<div class="node ${state === 'cur' ? 'cur open' : state === 'done' ? 'done' : 'open'}" style="--x:${x}px">${start}<a class="btn press lc-row ${state}" href="${esc(href)}"${state === 'cur' ? ' aria-current="step"' : ''} aria-label="${esc(title)} · ${esc(sub)}">${face}</a>${lbl}</div>`;
}

if (!course && !audio) {
  head.innerHTML = `<header class="ui-page-h lc-head"><span class="ui-ic lc-gl" aria-hidden="true"><b>${esc(glyph)}</b></span><div class="lc-ht"><h1>${esc(meta.name)}</h1></div></header>`;
  body.innerHTML = comingSoonHTML(lang);
} else {
  const p = courseProgress(code, course, audio);
  const native = meta.native && meta.native !== meta.name ? meta.native : (H ? 'हिंदी में' : '');
  const count = audio?.lessons?.length || (course?.units || []).reduce((n, u) => n + u.lessons.length, 0);
  const status = [native, `${count} ${t(lang, 'lessons')}`, p.done ? `${p.pct}%` : L('Not started', 'शुरू नहीं किया')].filter(Boolean).join(' · ');
  const hasBoth = !!(audio?.lessons?.length && course?.units?.length);
  head.innerHTML = `
    <header class="ui-page-h lc-head">
      <span class="ui-ic lc-gl" aria-hidden="true"><b>${esc(glyph)}</b></span>
      <div class="lc-ht"><h1 id="lcTitle">${esc(meta.name)}</h1><p>${esc(status)}</p>
        ${p.done ? `<span class="ui-prog" role="progressbar" aria-label="${L('Course progress', 'कोर्स प्रगति')}" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p.pct}%"></i></span>` : ''}</div>
    </header>
    <div class="lx-hub"><div id="lxStats"></div></div>
    <div id="lxNext"></div>
    <a class="lx-talk" id="lxTalk" href="/?tab=bro&persona=language&course=${code}">${H ? `Bro से ${esc(meta.name)} में बात करो` : `Talk to Bro in ${esc(meta.name)}`}</a>
    ${hasBoth ? `<div class="ui-seg lc-seg" id="seg" role="tablist" aria-label="${L('Lesson type', 'पाठ का प्रकार')}">
      <button type="button" role="tab" data-m="audio" aria-controls="body">${L('Listen', 'सुनो')}</button><button type="button" role="tab" data-m="practice" aria-controls="body">${L('Practice', 'अभ्यास')}</button>
    </div>` : ''}`;
  window.bdTitleOnScroll && window.bdTitleOnScroll(document.getElementById('lcTitle'));

  // ---- Listen: the audio lessons, one list ----
  const audioHTML = () => {
    if (!audio?.lessons?.length) return comingSoonHTML(lang);
    const ls = audio.lessons;
    const firstOpen = ls.findIndex(l => !isDone(l.id));
    nodeI = 0;
    return `<div class="lc-path">${ls.map((l, i) => {
      const done = isDone(l.id), cur = i === firstOpen;
      const open = done || cur || i === 0 || isDone(ls[i - 1].id);
      const min = `${l.minutes || 15} ${t(lang, 'min')}`;
      const state = done ? 'done' : cur ? 'cur' : open ? 'open' : 'locked';
      const sub = state === 'locked' ? t(lang, 'locked') : state === 'done' ? `${min} · ${t(lang, 'done')}` : state === 'cur' && l.goal ? `${min} · ${l.goal}` : min;
      return row({ n: i + 1, title: clean(l.title), sub, href: `/lang/audio.html?c=${code}&l=${encodeURIComponent(l.id)}`, state });
    }).join('')}</div>`;
  };

  // ---- Practice: one section per unit, the same rows ----
  const all = (course?.units || []).flatMap(u => u.lessons.map(l => ({ u, l })));
  const firstOpenK = all.findIndex(x => !isDone(x.l.id));
  const practiceHTML = () => {
    if (!course?.units?.length) return comingSoonHTML(lang);
    let k = -1; nodeI = 0;
    return course.units.map((u, ui) => {
      const doneN = u.lessons.filter(l => isDone(l.id)).length;
      const rows = u.lessons.map((l, li) => {
        const kk = ++k, done = isDone(l.id), cur = kk === firstOpenK;
        const open = done || cur || kk === 0 || isDone(all[kk - 1].l.id);
        const state = done ? 'done' : cur ? 'cur' : open ? 'open' : 'locked';
        const n = l.items?.length || 0;
        const ex = `${n} ${L('exercises', 'अभ्यास')}`;
        const sub = state === 'locked' ? t(lang, 'locked') : state === 'done' ? t(lang, 'done') : state === 'cur' ? `${ex} · 5 ${t(lang, 'min')}` : ex;
        return row({ n: li + 1, title: clean(l.title), sub, href: `/lang/lesson.html?c=${code}&u=${encodeURIComponent(u.id)}&l=${encodeURIComponent(l.id)}`, state });
      }).join('');
      return `<section class="lc-unit" aria-labelledby="lcU${ui + 1}">
        <h2 class="ui-sec" id="lcU${ui + 1}"><span>${t(lang, 'unit')} ${ui + 1} · ${esc(clean(u.title))}</span><span class="lc-cnt">${doneN}/${u.lessons.length}</span></h2>
        <div class="lc-path">${rows}</div></section>`;
    }).join('');
  };

  let mode = (location.hash === '#practice' && course?.units?.length) || !audio?.lessons?.length ? 'practice' : 'audio';
  const seg = document.getElementById('seg');
  // v21: one big Continue: the next lesson not done yet (in the list you are looking at, else the other one)
  const nextItem = () => {
    const ls = audio?.lessons || [];
    const a = ls.find(l => !isDone(l.id)), pr = all.find(x => !isDone(x.l.id));
    const aItem = a && { href: `/lang/audio.html?c=${code}&l=${encodeURIComponent(a.id)}`, title: clean(a.title), sub: `${L('Listen', 'सुनो')} · ${a.minutes || 15} ${t(lang, 'min')}` };
    const pItem = pr && { href: `/lang/lesson.html?c=${code}&u=${encodeURIComponent(pr.u.id)}&l=${encodeURIComponent(pr.l.id)}`, title: clean(pr.l.title), sub: `${L('Practice', 'अभ्यास')} · 5 ${t(lang, 'min')}` };
    return mode === 'practice' ? (pItem || aItem) : (aItem || pItem);
  };
  const drawNext = () => {
    const n = nextItem(), el = document.getElementById('lxNext'); if (!el) return;
    el.innerHTML = n ? `<a class="lx-continue press" id="lxContinue" href="${esc(n.href)}"><span class="ic">${PLAY}</span><span><b>${esc(s.done && Object.keys(s.done).some(k => k.startsWith(code + '/')) ? t(lang, 'continue') : t(lang, 'start'))} · ${esc(n.title)}</b><small>${esc(n.sub)}</small></span></a>` : `<div class="lx-continue" style="justify-content:center"><b>${L('Course complete', 'कोर्स पूरा')}</b></div>`;
  };
  mountStats(document.getElementById('lxStats'), code, lang);
  const render = first => {
    drawNext();
    if (seg) seg.querySelectorAll('button').forEach(b => { const on = b.dataset.m === mode; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    body.innerHTML = `<div class="lc-pane">${mode === 'audio' ? audioHTML() : practiceHTML()}</div>`;
    try { history.replaceState(history.state, '', mode === 'practice' ? '#practice' : location.pathname + location.search); } catch (e) { /* sandboxed */ }
    // bring the next lesson into view when it is further down the list
    const cur = body.querySelector('.lc-row.cur');
    if (first && cur && cur.getBoundingClientRect().bottom > innerHeight - 24) setTimeout(() => cur.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }), 120);
  };
  if (seg) {
    seg.addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (b && b.dataset.m !== mode) { mode = b.dataset.m; render(); } });
    seg.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      mode = mode === 'audio' ? 'practice' : 'audio'; render(); seg.querySelector(`[data-m="${mode}"]`).focus(); e.preventDefault();
    });
  }
  body.addEventListener('click', e => { if (e.target.closest('[data-locked]')) toast(t(lang, 'firstLesson')); });
  render(true);
  // v21: progress made on another phone comes back (lessons done, XP, the streak)
  pullProgress().then(changed => { if (!changed) return; s = store.read(); mountStats(document.getElementById('lxStats'), code, lang); render(); });
}
</script>
</body>
</html>
