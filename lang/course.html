<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bd_theme")||(localStorage.getItem("theme")==="aurora"?"dark":"");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-theme","aurora")})}}catch(e){}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Course · Brodoit Languages</title>
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app/theme.css?v=16">
<link rel="stylesheet" href="/lang/assets/lang.css?v=16">
<link rel="stylesheet" href="/lang/assets/topbar.css?v=15">
<link rel="stylesheet" href="/lang/assets/stages.css?v=2">
<script src="/app/icons.js?v=16" defer></script>
<script src="/lang/assets/topbar.js?v=15" defer></script>
</head>
<body class="stg-page">
<main class="wrap" style="padding-bottom:60px">
  <div id="head"></div>
  <div id="body"></div>
</main>
<script type="module">
import { renderChrome, loadCourses, loadCourse, loadAudioCourse, store, esc, t, param, courseProgress, computeStreak, setCourse, toast, comingSoonHTML } from '/lang/assets/lang.js?v=10';
import { ic } from '/lang/assets/ico.js?v=14';

// The School of Languages: Spanish, French, German and Hindi (taught in English), English (taught in Hindi).
const SCHOOL = ['es', 'fr', 'de', 'hi', 'en'];
const code = param('c') || 'es';
if (!SCHOOL.includes(code)) location.replace('/lang/');
const courses = await loadCourses();
const meta = courses.find(c => c.code === code) || { code, name: code.toUpperCase(), native: '', flag: '', from: 'en', tagline: '', hasAudio: true };
const lang = meta.from;
const H = lang === 'hi';
const L = (en, hi) => H ? hi : en;
document.title = `${meta.name} · Brodoit Languages`;
const [course, audio] = await Promise.all([loadCourse(code), meta.hasAudio === false ? null : loadAudioCourse(code)]);
setCourse(code);
const s = store.read();
const streak = computeStreak(s.daily);
renderChrome({ back: '/?tab=learn', backLabel: 'Learn', right: `<span class="pill">${ic('flame', 16)} ${streak}</span>` });

const head = document.getElementById('head'), body = document.getElementById('body');
const HUES = ['#E0603F', '#2F7D4F', '#3B7FD0', '#8B5CF6', '#C2410C', '#0E9F9A', '#B5402A', '#6D28D9', '#B45309', '#BE185D'];

if (!course && !audio) {
  body.innerHTML = comingSoonHTML(lang);
} else {
  const p = courseProgress(code, course, audio);
  const r = 24, circ = 2 * Math.PI * r;
  head.innerHTML = `
    <section class="stg-hero">
      <img src="/app/img/cards/lang-${code}.jpg" alt="" onerror="this.remove()">
      <div class="stg-hshade"></div>
      <div class="stg-hb">
        <h1><span class="stg-flag">${meta.flag || ''}</span>${esc(meta.name)} ${meta.native && meta.native !== meta.name ? `<span>${esc(meta.native)}</span>` : ''}</h1>
        <div class="stg-stats">
          <span class="stg-ring"><svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" class="t"/><circle cx="28" cy="28" r="${r}" class="v" style="stroke-dasharray:${circ};stroke-dashoffset:${circ * (1 - p.pct / 100)}"/></svg><b>${p.pct}%</b></span>
          <span class="stg-chip">${ic('zap', 15)}<b>${s.xp || 0}</b> XP</span>
        </div>
      </div>
    </section>
    <div class="seg stg-seg" id="seg"><div class="thumb"></div>
      <button data-m="audio" class="on">${ic('headphones', 16)} ${L('Listen', 'सुनो')}</button><button data-m="practice">${ic('star', 16)} ${L('Practice', 'अभ्यास')}</button></div>`;

  // ---- Listen: audio episodes ----
  const audioHTML = () => {
    if (!audio?.lessons?.length) return comingSoonHTML(lang, '/lang/');
    const ls = audio.lessons;
    const firstOpen = ls.findIndex(l => !s.done[`${code}/${l.id}`]);
    return `<div class="eps">${ls.map((l, i) => {
      const done = !!s.done[`${code}/${l.id}`], open = done || i === 0 || !!s.done[`${code}/${ls[i - 1].id}`] || i === firstOpen;
      const cur = i === firstOpen;
      const title = String(l.title || '').replace(/^Lesson\s*\d+\s*[—–-]\s*/i, '').replace(/^पाठ\s*\d+\s*[—–-]\s*/, '');
      const inner = `<span class="ep-n">${done ? ic('check', 20) : !open ? ic('lock', 16) : i + 1}</span>
        <span class="ep-t"><b>${esc(title)}</b><small>${l.minutes || 15} ${t(lang, 'min')}${cur && l.goal ? ' · ' + esc(l.goal) : ''}</small></span>
        ${cur ? `<span class="ep-play">${ic('play', 18)}</span>` : ''}`;
      return open ? `<a class="ep${done ? ' done' : ''}${cur ? ' cur' : ''}" style="--i:${i}" href="/lang/audio.html?c=${code}&l=${encodeURIComponent(l.id)}">${inner}</a>`
        : `<button class="ep locked" style="--i:${i}" data-locked>${inner}</button>`;
    }).join('')}</div>`;
  };

  // ---- Practice: one stage per unit, four lessons each, Bro waiting at your next lesson ----
  const all = (course?.units || []).flatMap(u => u.lessons.map(l => ({ u, l })));
  const firstOpenK = all.findIndex(x => !s.done[`${code}/${x.l.id}`]);
  const practiceHTML = () => {
    if (!course?.units?.length) return comingSoonHTML(lang, '/lang/');
    let k = -1;
    return course.units.map((u, ui) => {
      const ks = u.lessons.map(() => ++k);
      const doneN = u.lessons.filter(l => s.done[`${code}/${l.id}`]).length;
      const firstK = ks[0];
      const unlocked = firstK === 0 || !!s.done[`${code}/${all[firstK - 1].l.id}`] || doneN > 0;
      const state = doneN === u.lessons.length ? 'done' : (ks.includes(firstOpenK) ? 'cur' : unlocked ? 'open' : 'locked');
      const offs = [0, 56, 0, -56];
      const nodes = u.lessons.map((l, li) => {
        const kk = ks[li], done = !!s.done[`${code}/${l.id}`];
        const open = kk === 0 || done || !!s.done[`${code}/${all[kk - 1].l.id}`];
        const cur = kk === firstOpenK, last = li === u.lessons.length - 1;
        const cls = done ? 'done' : cur ? 'cur' : open ? 'open' : 'locked';
        const icn = done ? ic('check', 26) : !open ? ic('lock', 20) : last ? ic('trophy', 24) : ic('star', 24);
        const href = `/lang/lesson.html?c=${code}&u=${encodeURIComponent(u.id)}&l=${encodeURIComponent(l.id)}`;
        return `<div class="nd-w" style="--x:${offs[li % 4]}px;--j:${li}">
          ${cur ? `<span class="nd-bro"><img src="/app/mascot.svg" alt="" width="40" height="40"><i>${L('Next up', 'अगला')}</i></span>` : ''}
          <button class="nd ${cls}" ${open ? `data-go="${esc(href)}" data-stage="${ui + 1}" data-lesson="${li + 1}" data-title="${esc(l.title)}" data-n="${l.items?.length || 0}" data-e="${esc(u.emoji || '')}"` : 'data-locked'} aria-label="${esc(l.title)}">${icn}</button>
          <span class="nd-l">${esc(l.title)}</span></div>`;
      }).join('');
      return `<section class="stg ${state}" style="--hue:${HUES[ui % HUES.length]};--i:${ui}" id="stg${ui + 1}">
        <div class="stg-h"><span class="stg-e">${u.emoji || ''}</span>
          <div class="stg-ht"><small>${L('Stage', 'स्टेज')} ${ui + 1}${state === 'done' ? ' · ' + L('cleared', 'पूरा') : ''}</small><b>${esc(u.title)}</b>${state === 'cur' && u.goal ? `<span>${esc(u.goal)}</span>` : ''}</div>
          <span class="stg-c">${state === 'locked' ? ic('lock', 16) : `${doneN}/${u.lessons.length}`}</span></div>
        <div class="stg-path">${nodes}</div>
        ${state === 'done' ? `<div class="stg-won">${ic('trophy', 16)} ${L('Stage cleared', 'स्टेज पूरा')}</div>` : ''}
      </section>`;
    }).join('');
  };

  // ---- the gate: entering a lesson feels like entering a level ----
  function gate(b) {
    const hue = (b.closest('.stg') && b.closest('.stg').style.getPropertyValue('--hue')) || '#E0603F';
    const g = document.createElement('div'); g.className = 'gate'; g.setAttribute('role', 'dialog');
    g.innerHTML = `<div class="gate-card" style="--hue:${hue}">
      <div class="gate-burst" aria-hidden="true"></div><div class="gate-e">${b.dataset.e || ''}</div>
      <small>${L('Stage', 'स्टेज')} ${b.dataset.stage} · ${L('Lesson', 'पाठ')} ${b.dataset.lesson}</small>
      <h2>${esc(b.dataset.title)}</h2>
      <p>${b.dataset.n} ${L('quick exercises, about 5 minutes', 'छोटे अभ्यास, लगभग 5 मिनट')}</p>
      <a class="gate-go" href="${b.dataset.go}">${L("Let's go", 'चलो शुरू करें')} ${ic('arrow-right', 18)}</a>
      <button class="gate-x" aria-label="${L('Close', 'बंद')}">${ic('x', 20)}</button></div>`;
    document.body.appendChild(g);
    requestAnimationFrame(() => g.classList.add('in'));
    const close = () => { g.classList.remove('in'); setTimeout(() => g.remove(), 280); };
    g.addEventListener('click', e => { if (e.target === g || e.target.closest('.gate-x')) close(); });
    g.querySelector('.gate-go').addEventListener('click', e => { e.preventDefault(); g.classList.add('zoom'); setTimeout(() => { location.href = b.dataset.go; }, 360); });
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* ignore */ }
  }

  let mode = (location.hash === '#practice' || !audio?.lessons?.length) ? 'practice' : 'audio';
  const seg = document.getElementById('seg');
  const render = () => {
    seg.classList.toggle('r', mode === 'practice');
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
    body.innerHTML = `<div class="pane on">${mode === 'audio' ? audioHTML() : practiceHTML()}</div>`;
    history.replaceState(null, '', mode === 'practice' ? '#practice' : location.pathname + location.search);
    const cur = body.querySelector(mode === 'practice' ? '.stg.cur' : '.ep.cur');
    if (cur && (mode === 'practice' ? cur.id !== 'stg1' : body.querySelectorAll('.ep.done').length > 2)) setTimeout(() => cur.scrollIntoView({ block: 'center', behavior: 'smooth' }), 120);
  };
  seg.addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (b && b.dataset.m !== mode) { mode = b.dataset.m; render(); } });
  body.addEventListener('click', e => {
    if (e.target.closest('[data-locked]')) { toast(t(lang, 'firstLesson')); return; }
    const n = e.target.closest('.nd[data-go]'); if (n) gate(n);
  });
  render();
}
</script>
</body>
</html>
